name: Format Phase45D Answerability Once

on:
  push:
    branches:
      - implementation/step-4-memory-context

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.5'
      - name: Finalize answerability research files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/research/step4_phase45d_answerability_bakeoff.py')
          text = path.read_text(encoding='utf-8')
          old = 'raise RuntimeError("QA pipeline returned an unexpected output type")'
          new = 'raise TypeError("QA pipeline returned an unexpected output type")'
          if old not in text:
              raise RuntimeError('expected QA output-type guard not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format tools/research/step4_phase45d_answerability_cases.py tools/research/step4_phase45d_answerability_bakeoff.py tests/test_phase45d_answerability_bakeoff.py
          ruff check tools/research/step4_phase45d_answerability_cases.py tools/research/step4_phase45d_answerability_bakeoff.py tests/test_phase45d_answerability_bakeoff.py
      - name: Commit final pre-owner source
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/research/step4_phase45d_answerability_cases.py tools/research/step4_phase45d_answerability_bakeoff.py tests/test_phase45d_answerability_bakeoff.py
          git commit -m 'Finalize Phase 4.5D answerability benchmark source'
          git push origin HEAD:implementation/step-4-memory-context
