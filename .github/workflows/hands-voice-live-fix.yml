name: Hands voice live-gate repair

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch voice Hands grounding and observability
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          path = Path("src/jarvis/voice/hands_goal_tools.py")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '_MAX_APP_CHARS = 160\n',
              '''_MAX_APP_CHARS = 160
          _OPERATION_ALIASES = {
              "set_volume": "set_master_volume",
              "get_volume": "get_master_volume",
              "mute_volume": "mute_master_volume",
              "unmute_volume": "unmute_master_volume",
              "create_file": "create_text_file",
              "write_file": "create_text_file",
              "list_bluetooth": "list_bluetooth_devices",
              "get_bluetooth_devices": "list_bluetooth_devices",
              "winget_search": "search_software",
              "search_winget": "search_software",
              "software_search": "search_software",
              "git_repo_status": "git_status",
          }
          ''',
              "operation aliases",
          )

          text = replace_once(
              text,
              '    "create_text_file": ("create file", "make file", "new file", "write file"),\n',
              '''    "create_text_file": (
              "create file",
              "create a file",
              "create text file",
              "create a text file",
              "make file",
              "new file",
              "write file",
          ),
          ''',
              "file intent markers",
          )

          text = replace_once(
              text,
              '    "search_software": ("software", "app", "package", "winget", "install"),\n',
              '''    "search_software": (
              "software",
              "app",
              "package",
              "winget",
              "win get",
              "wing it",
              "search software",
              "search package",
              "install",
          ),
          ''',
              "software intent markers",
          )

          text = replace_once(
              text,
              '''_REQUEST_PREFIXES = (
              "hey jarvis",
              "okay jarvis",
              "ok jarvis",
              "jarvis",
              "please",
              "can you",
              "could you",
              "would you",
              "will you",
          )
          ''',
              '''_REQUEST_PREFIXES = (
              "hey jarvis",
              "okay jarvis",
              "ok jarvis",
              "jarvis",
              "hey javis",
              "okay javis",
              "ok javis",
              "javis",
              "yeah",
              "yes",
              "okay",
              "ok",
              "so",
              "alright",
              "all right",
              "please",
              "can you",
              "could you",
              "would you",
              "will you",
          )
          ''',
              "request prefixes",
          )

          text = replace_once(
              text,
              '''def _normalized(value: object) -> str:
              return " ".join(re.sub(r"[^\\w]+", " ", str(value).casefold()).split())


          def _contains_marker''',
              '''def _normalized(value: object) -> str:
              return " ".join(re.sub(r"[^\\w]+", " ", str(value).casefold()).split())


          def _spoken_punctuation_normalized(value: object) -> str:
              text = str(value).casefold()
              for symbol, spoken in (
                  ("\\\\", " backslash "),
                  ("/", " slash "),
                  ("_", " underscore "),
                  ("-", " dash "),
                  (".", " dot "),
              ):
                  text = text.replace(symbol, spoken)
              return " ".join(re.sub(r"[^\\w]+", " ", text).split())


          def _contains_marker''',
              "spoken punctuation normalizer",
          )

          text = replace_once(
              text,
              '''def _material_in_text(value: object, text: str) -> bool:
              material = _normalized(value)
              return bool(material) and material in _normalized(text)
          ''',
              '''def _material_in_text(value: object, text: str) -> bool:
              material = _normalized(value)
              normalized_text = _normalized(text)
              if bool(material) and material in normalized_text:
                  return True
              spoken_material = _spoken_punctuation_normalized(value)
              return bool(spoken_material) and spoken_material in normalized_text
          ''',
              "material grounding",
          )

          text = replace_once(
              text,
              '''        operation = str(raw.get("operation", "")).strip()
              semantic = self._runtime.hands_registry.require(operation)
          ''',
              '''        requested_operation = str(raw.get("operation", "")).strip().casefold()
              operation = _OPERATION_ALIASES.get(requested_operation, requested_operation)
              semantic = self._runtime.hands_registry.require(operation)
          ''',
              "operation canonicalization",
          )

          text = replace_once(
              text,
              '''        Each item is {"operation": "...", "parameters": {...}}. Semantic operations
              cover apps/windows/audio/media/clipboard plus governed files and documents,
              structured Playwright browser work, display/Bluetooth/power controls, bounded
              WinGet software management and Dulwich Git development work.
          ''',
              '''        Each item is {"operation": "...", "parameters": {...}}. Use canonical
              operation names, not friendly synonyms. In particular: `open_app`,
              `get_master_volume`, `set_master_volume`, `mute_master_volume`,
              `unmute_master_volume`, `create_text_file`, `replace_text_file`,
              `append_text_file`, `make_directory`, `create_docx`, `create_xlsx`,
              `create_pptx`, `execute_browser_plan`, `list_displays`,
              `get_display_brightness`, `set_display_brightness`,
              `list_bluetooth_devices`, `pair_bluetooth_device`,
              `unpair_bluetooth_device`, `search_software`, `list_installed_software`,
              `install_package`, `uninstall_package`, `git_status`, `git_active_branch`,
              `git_create_branch`, `git_stage_paths`, `git_commit`, and
              `git_push_current`. Do not invent names such as `set_volume` or
              `create_file`; compatibility aliases are only a fail-safe at the boundary.
          ''',
              "tool operation guidance",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/jarvis/voice/production_runtime.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''    structured_hands = capability_catalog.by_key("windows:desktop.control")
              visual_hands = capability_catalog.by_key("visual:desktop.control")
              LOGGER.info(
                  "Governed capability runtime configured: capabilities=%s read_executors=2 "
                  "structured_desktop_control=%s visual_fallback=%s browser_control=False "
                  "raw_shell=False",
                  len(capability_catalog.capabilities),
                  bool(structured_hands and structured_hands.execution_enabled),
                  bool(visual_hands and visual_hands.execution_enabled),
              )
          ''',
              '''    structured_hands = capability_catalog.by_key("windows:desktop.control")
              visual_hands = capability_catalog.by_key("visual:desktop.control")
              browser_hands = capability_catalog.by_key("browser:playwright")
              LOGGER.info(
                  "Governed capability runtime configured: capabilities=%s read_executors=2 "
                  "structured_desktop_control=%s visual_fallback=%s browser_control=%s "
                  "raw_shell=False",
                  len(capability_catalog.capabilities),
                  bool(structured_hands and structured_hands.execution_enabled),
                  bool(visual_hands and visual_hands.execution_enabled),
                  bool(browser_hands and browser_hands.execution_enabled),
              )
          ''',
              "production browser log",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/jarvis/voice/canonical_active_speaker_runtime.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''        if capability_runtime is not None:
                  LOGGER.info(
                      "Governed local capabilities are active | local_reads=True | "
                      "structured_desktop_control=True | visual_fallback=owner_opt_in | "
                      "browser_control=False | raw_shell=False"
                  )
          ''',
              '''        if capability_runtime is not None:
                  capability_catalog = capability_runtime.refresh_catalog()
                  browser_hands = capability_catalog.by_key("browser:playwright")
                  LOGGER.info(
                      "Governed local capabilities are active | local_reads=True | "
                      "structured_desktop_control=True | visual_fallback=owner_opt_in | "
                      "browser_control=%s | raw_shell=False",
                      bool(browser_hands and browser_hands.execution_enabled),
                  )
          ''',
              "active runtime browser log",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_hands_goal_tools.py")
          text = path.read_text(encoding="utf-8")
          addition = '''

          def test_live_voice_aliases_and_transcription_fillers_are_canonicalized() -> None:
              tool = tools("Javis open calculator and set my master volume to 90 percent")
              plan = json.dumps(
                  [
                      {"operation": "open_app", "parameters": {"app": "calculator"}},
                      {"operation": "set_volume", "parameters": {"percent": 90}},
                  ]
              )

              steps = tool._parse_plan(plan, tool._latest_user_turn().text)

              assert [step.operation for step in steps] == [
                  "open_app",
                  "set_master_volume",
              ]
              assert steps[1].parameters == {"percent": 90.0}


          def test_voice_file_alias_accepts_spoken_dot_without_weakening_content_grounding() -> None:
              tool = tools(
                  "So create a text file in Downloads named voice test dot txt with text hello world"
              )
              plan = json.dumps(
                  [
                      {
                          "operation": "create_file",
                          "parameters": {
                              "root": "downloads",
                              "path": "voice test.txt",
                              "text": "hello world",
                          },
                      }
                  ]
              )

              step = tool._parse_plan(plan, tool._latest_user_turn().text)[0]

              assert step.operation == "create_text_file"
              assert step.parameters == {
                  "root": "downloads",
                  "path": "voice test.txt",
                  "text": "hello world",
              }


          def test_voice_winget_transcription_variant_warrants_non_mutating_search() -> None:
              tool = tools(
                  "Yeah could you list my Bluetooth devices and search Wing It for PowerToys"
              )
              plan = json.dumps(
                  [
                      {"operation": "list_bluetooth_devices", "parameters": {}},
                      {
                          "operation": "winget_search",
                          "parameters": {"query": "PowerToys"},
                      },
                  ]
              )

              steps = tool._parse_plan(plan, tool._latest_user_turn().text)

              assert [step.operation for step in steps] == [
                  "list_bluetooth_devices",
                  "search_software",
              ]
              assert steps[1].parameters == {"query": "PowerToys"}
          '''
          if "test_live_voice_aliases_and_transcription_fillers_are_canonicalized" in text:
              raise SystemExit("voice regression tests already present")
          path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")

      - name: Install targeted test dependencies
        run: python -m pip install -e ".[dev,hands]"

      - name: Format and lint touched Python
        run: |
          python -m ruff format src/jarvis/voice/hands_goal_tools.py src/jarvis/voice/production_runtime.py src/jarvis/voice/canonical_active_speaker_runtime.py tests/test_hands_goal_tools.py
          python -m ruff check src/jarvis/voice/hands_goal_tools.py src/jarvis/voice/production_runtime.py src/jarvis/voice/canonical_active_speaker_runtime.py tests/test_hands_goal_tools.py

      - name: Run focused regressions
        run: python -m pytest -q tests/test_hands_goal_tools.py tests/test_production_hands_voice_wiring.py

      - name: Commit repaired voice boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/voice/hands_goal_tools.py src/jarvis/voice/production_runtime.py src/jarvis/voice/canonical_active_speaker_runtime.py tests/test_hands_goal_tools.py
          git diff --cached --quiet && exit 0
          git commit -m "Harden Hands voice planning against live transcription"
          git push origin HEAD:feat/governed-jarvis-hands-v1
