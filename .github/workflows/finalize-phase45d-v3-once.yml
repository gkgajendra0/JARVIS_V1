name: Finalize Phase 4.5D V3 Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/finalize-phase45d-v3-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0

      - name: Format and lint V3 files
        shell: bash
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format tools/research/step4_phase45d_final_v3_cases.py tools/research/step4_phase45d_final_v3_acceptance.py tests/test_phase45d_final_v3_cases.py tests/test_phase45d_final_v3_acceptance.py
          ruff check --fix tools/research/step4_phase45d_final_v3_cases.py tools/research/step4_phase45d_final_v3_acceptance.py tests/test_phase45d_final_v3_cases.py tests/test_phase45d_final_v3_acceptance.py
          ruff format tools/research/step4_phase45d_final_v3_cases.py tools/research/step4_phase45d_final_v3_acceptance.py tests/test_phase45d_final_v3_cases.py tests/test_phase45d_final_v3_acceptance.py
          ruff check tools/research/step4_phase45d_final_v3_cases.py tools/research/step4_phase45d_final_v3_acceptance.py tests/test_phase45d_final_v3_cases.py tests/test_phase45d_final_v3_acceptance.py

      - name: Print frozen V3 payload hash
        shell: bash
        run: PYTHONPATH=tools/research python tools/research/step4_phase45d_final_v3_cases.py

      - name: Commit formatted V3 files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/step4_phase45d_final_v3_cases.py tools/research/step4_phase45d_final_v3_acceptance.py tests/test_phase45d_final_v3_cases.py tests/test_phase45d_final_v3_acceptance.py
          git commit -m "Format fresh Phase 4.5D V3 acceptance"
          git push origin HEAD:implementation/step-4-memory-context
