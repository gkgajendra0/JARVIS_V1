name: Hands Goal Architecture Refactor V2

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hands-goal-refactor-v2]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply architecture refactor
        run: python tools/hands_goal_architecture_refactor_v2.py
      - name: Apply deterministic lint follow-ups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one lint anchor in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/jarvis/capabilities/windows_control.py",
              "            launcher = AllowlistedWindowsLauncher()\n            existing = ui.status(app, check=False)",
              "            existing = ui.status(app, check=False)",
          )
          replace_once(
              "src/jarvis/voice/hands_goal_tools.py",
              "        if allow_context and _contains_marker(user_text, _CURRENT_TARGET_MARKERS):\n            if self._recently_grounded_app(app):\n                return",
              "        if (\n            allow_context\n            and _contains_marker(user_text, _CURRENT_TARGET_MARKERS)\n            and self._recently_grounded_app(app)\n        ):\n            return",
          )
          replace_once(
              "src/jarvis/voice/hands_goal_tools.py",
              "        if not _contains_marker(user_text, markers):\n            if operation != \"get_current_media\" or not _contains_marker(\n                user_text, _MEDIA_CONTEXT_MARKERS\n            ):\n                raise HandsGoalGroundingError(\n                    f\"latest user request does not warrant Hands operation: {operation}\"\n                )",
              "        if not _contains_marker(user_text, markers) and (\n            operation != \"get_current_media\"\n            or not _contains_marker(user_text, _MEDIA_CONTEXT_MARKERS)\n        ):\n            raise HandsGoalGroundingError(\n                f\"latest user request does not warrant Hands operation: {operation}\"\n            )",
          )
          PY
      - name: Format and lint touched code
        run: |
          python -m pip install ruff==0.16.5
          ruff format src/jarvis/capabilities/windows_native.py src/jarvis/capabilities/windows_control.py src/jarvis/capabilities/runtime.py src/jarvis/voice/capability_tools.py src/jarvis/voice/agent.py src/jarvis/voice/hands_goal_tools.py src/jarvis/hands/app_catalog.py src/jarvis/computer/hands_smoke.py
          ruff check src/jarvis/capabilities/windows_native.py src/jarvis/capabilities/windows_control.py src/jarvis/capabilities/runtime.py src/jarvis/voice/capability_tools.py src/jarvis/voice/agent.py src/jarvis/voice/hands_goal_tools.py src/jarvis/hands/app_catalog.py src/jarvis/computer/hands_smoke.py --fix
      - name: Remove temporary refactor files
        shell: bash
        run: |
          rm -f tools/hands_goal_architecture_refactor.py
          rm -f tools/hands_goal_architecture_refactor_v2.py
          rm -f .github/workflows/hands-goal-architecture-refactor-v2.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Hands around one goal boundary [hands-goal-refactor-v2]"
          git push origin HEAD:feat/governed-jarvis-hands-v1
