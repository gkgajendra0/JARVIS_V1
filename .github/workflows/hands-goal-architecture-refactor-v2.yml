name: Hands Goal Architecture Refactor V2

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hands-goal-refactor-v2]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply architecture refactor
        run: python tools/hands_goal_architecture_refactor_v2.py
      - name: Format and lint touched code
        run: |
          python -m pip install ruff==0.16.5
          ruff format src/jarvis/capabilities/windows_native.py src/jarvis/capabilities/windows_control.py src/jarvis/capabilities/runtime.py src/jarvis/voice/capability_tools.py src/jarvis/voice/agent.py src/jarvis/voice/hands_goal_tools.py src/jarvis/hands/app_catalog.py src/jarvis/computer/hands_smoke.py
          ruff check src/jarvis/capabilities/windows_native.py src/jarvis/capabilities/windows_control.py src/jarvis/capabilities/runtime.py src/jarvis/voice/capability_tools.py src/jarvis/voice/agent.py src/jarvis/voice/hands_goal_tools.py src/jarvis/hands/app_catalog.py src/jarvis/computer/hands_smoke.py --fix
      - name: Remove temporary refactor files
        shell: bash
        run: |
          rm -f tools/hands_goal_architecture_refactor.py
          rm -f tools/hands_goal_architecture_refactor_v2.py
          rm -f .github/workflows/hands-goal-architecture-refactor-v2.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Hands around one goal boundary [hands-goal-refactor-v2]"
          git push origin HEAD:feat/governed-jarvis-hands-v1
