name: Code Quality

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  POWERSHELL_TELEMETRY_OPTOUT: "1"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff==0.16.5"

      - name: Check formatting
        run: ruff format --check .

      - name: Check lint
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preinstall LiveKit BlingFire wheel
        run: >-
          python -m pip install
          "https://files.pythonhosted.org/packages/8f/27/408c435cbed31fa3601ff32ef0499ff594cd898b483c9b4017e9df906de6/livekit_blingfire-1.1.0-cp311-cp311-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl"

      - name: Install JARVIS test dependencies
        run: python -m pip install -e ".[dev,phase45d-acceptance,hands]"

      - name: Provision Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Smoke Playwright Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              executable = playwright.chromium.executable_path
              browser = playwright.chromium.launch(headless=True)
              browser.close()
              print(f"Playwright Chromium launch ready: {executable}")
          PY

      - name: Run unit tests without internet access
        run: |
          sudo --preserve-env=DOTNET_CLI_TELEMETRY_OPTOUT,POWERSHELL_TELEMETRY_OPTOUT unshare --net -- bash -c '
            ip link set lo up
            exec runuser -u "$1" -- "${@:2}"
          ' _ "$(id -un)" "$(command -v python)" -m pytest -q --junitxml=full-suite.xml

      - name: Preserve full-suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-evidence
          path: full-suite.xml

  windows-hello-helper:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build Windows Hello helper
        run: >-
          dotnet build
          tools/windows/Jarvis.WindowsHelloVerifier/Jarvis.WindowsHelloVerifier.csproj
          --configuration Release
          --nologo

      - name: Probe Windows Hello helper JSON contract
        shell: pwsh
        run: |
          $helper = Resolve-Path ".\tools\windows\Jarvis.WindowsHelloVerifier\bin\Release\net9.0-windows10.0.22000.0\Jarvis.WindowsHelloVerifier.exe"
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $helper.Path
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo
          if (-not $process.Start()) {
            throw "Failed to start Windows Hello helper contract probe"
          }
          $process.StandardInput.Write('{}')
          $process.StandardInput.Close()
          $response = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          if ($process.ExitCode -ne 2) {
            throw "Expected invalid-request exit code 2, got $($process.ExitCode). stderr=$stderr"
          }
          $payload = $response | ConvertFrom-Json
          if ($payload.status -ne 'error' -or $payload.reason -ne 'invalid_request') {
            throw "Windows Hello helper JSON contract mismatch: $response"
          }

      - name: Publish production Windows Hello helper
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "jarvis-hello-publish"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $output
          dotnet publish `
            tools/windows/Jarvis.WindowsHelloVerifier/Jarvis.WindowsHelloVerifier.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --nologo `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            --output $output
          if ($LASTEXITCODE -ne 0) {
            throw "Production Windows Hello helper publish failed"
          }
          $helper = Join-Path $output "Jarvis.WindowsHelloVerifier.exe"
          if (-not (Test-Path $helper -PathType Leaf)) {
            throw "Published Windows Hello helper executable is missing"
          }

      - name: Probe published Windows Hello helper JSON contract
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP "jarvis-hello-publish\Jarvis.WindowsHelloVerifier.exe"
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $helper
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo
          if (-not $process.Start()) {
            throw "Failed to start published Windows Hello helper contract probe"
          }
          $process.StandardInput.Write('{}')
          $process.StandardInput.Close()
          $response = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          if ($process.ExitCode -ne 2) {
            throw "Expected published helper exit code 2, got $($process.ExitCode). stderr=$stderr"
          }
          $payload = $response | ConvertFrom-Json
          if ($payload.status -ne 'error' -or $payload.reason -ne 'invalid_request') {
            throw "Published Windows Hello helper JSON contract mismatch: $response"
          }

  windows-dpapi:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preinstall LiveKit BlingFire wheel
        run: >-
          python -m pip install
          "https://files.pythonhosted.org/packages/2f/12/c826a40b32bfda29e7f826e50dfbd3c0a70726cb8c0cb5023d2311823bd2/livekit_blingfire-1.1.0-cp311-cp311-win_amd64.whl"

      - name: Install unified JARVIS Hands test dependencies
        run: python -m pip install -e ".[dev,hands]"

      - name: Probe Windows Hands Python dependencies
        run: >-
          python -c "import pycaw; import win32clipboard; import win32gui;
          import winrt.windows.foundation; import winrt.windows.foundation.collections;
          import winrt.windows.media.control; import winrt.windows.devices.enumeration;
          import winrt.windows.devices.bluetooth; import screen_brightness_control;
          import send2trash; import docx; import openpyxl; import pptx; import playwright;
          import dulwich; import uroman; import jellyfish;
          print('Unified Windows Hands Python dependencies ready')"

      - name: Parse C6 LLMLingua owner PowerShell
        shell: powershell
        run: |
          $scripts = @(
            "tools/research/c6_llmlingua_owner_acceptance.ps1",
            "tools/research/c6_llmlingua_current_token_probe.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "C6 owner PowerShell has parse errors: $script"
            }
          }

      - name: Probe C6 current-token direct script execution
        shell: powershell
        run: |
          & python tools/research/c6_llmlingua_current_token_probe.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "C6 current-token probe failed direct script import/argument parsing."
          }

      - name: Execute C6 owner dependency version probe
        shell: powershell
        run: |
          $lines = & python tools/research/c6_dependency_probe.py
          if ($LASTEXITCODE -ne 0) {
            throw "C6 owner dependency probe failed to execute."
          }
          $probe = (($lines -join [Environment]::NewLine) | ConvertFrom-Json)
          if ([string]$probe.jsonschema_version -ne "4.26.0") {
            throw "Expected jsonschema==4.26.0, found '$($probe.jsonschema_version)'."
          }

      - name: Run Windows multilingual Hands regressions
        run: >-
          python -m pytest -q
          tests/test_hands_entities.py
          tests/test_hands_contracts.py
          tests/test_hands_generic_grounding.py
          tests/test_windows_hello_utf8.py

      - name: Run Windows sandbox path regressions
        run: >-
          python -m pytest -q
          tests/test_engineering_substrate_sandbox.py::test_pytest_target_cannot_become_docker_or_pytest_option

      - name: Run Windows Phase 6 replay regressions
        run: >-
          python -m pytest -q
          tests/test_incident_repair_evaluation.py
          tests/test_phase6_acceptance.py

      - name: Run Windows DPAPI smoke tests
        run: >-
          python -m pytest -q
          tests/test_windows_dpapi.py
          tests/test_engineering_substrate_secrets_windows.py

      - name: Run Phase 5E disposable secret acceptance
        run: python -m jarvis.engineering_substrate.secrets.acceptance

      - name: Run Windows Self-Repair Job Object smoke tests
        run: python -m pytest -q tests/test_self_repair_windows_job.py

      - name: Run Windows Phase 7 release and promotion regressions
        run: >-
          python -m pytest -q
          tests/test_phase7_promotion_domain.py
          tests/test_phase7_github_evidence.py
          tests/test_phase7_github_app.py
          tests/test_phase7_authority_merge.py
          tests/test_phase7_deployment.py
          tests/test_phase7_release_staging.py
          tests/test_phase7_evaluation.py

      - name: Run non-destructive Windows Phase 7 acceptance harness
        run: python -m jarvis.promotion.acceptance --repo-root .

      - name: Run Windows Phase 8 capability-registry regressions
        run: >-
          python -m pytest -q
          tests/test_capability_registry_contracts.py
          tests/test_capability_registry_store.py
          tests/test_capability_registry_compatibility.py
          tests/test_capability_registry_projection.py
          tests/test_capability_registry_lifecycle.py
          tests/test_capability_registry_retention.py
          tests/test_phase8_evaluation.py

      - name: Run non-destructive Windows Phase 8 acceptance harness
        run: python -m jarvis.capability_registry.acceptance --repo-root .

      - name: Run Windows Phase 9 capability-acquisition replay regressions
        run: >-
          python -m pytest -q
          tests/test_phase9_evaluation.py

      - name: Run Windows Phase 9 adversarial system hardening
        run: >-
          python -m pytest -q
          tests/test_capability_acquisition_system_hardening.py
          tests/test_capability_acquisition_owner_flow_hardening.py
          tests/test_capability_acquisition_completion_hardening.py
          tests/test_capability_acquisition_architecture_gicc_contract.py
          tests/test_capability_acquisition_promotion.py
          tests/test_phase9_voice_entrypoint.py
          tests/test_global_supervisor_existing_objective_preflight.py
          tests/test_engineering_substrate_discovery_onvif.py
          tests/test_goal_world_discovery.py


  acquisition-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preinstall LiveKit BlingFire wheel
        run: >-
          python -m pip install
          "https://files.pythonhosted.org/packages/8f/27/408c435cbed31fa3601ff32ef0499ff594cd898b483c9b4017e9df906de6/livekit_blingfire-1.1.0-cp311-cp311-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl"
      - name: Install acquisition test dependencies
        run: python -m pip install -e ".[dev,phase45d-acceptance,hands]"
      - name: Build governed development sandbox
        run: docker build -f tools/development-sandbox/Dockerfile -t jarvis-acquisition-test:ci .
      - name: Run acquisition vertical with required Docker execution
        env:
          JARVIS_E2E_REQUIRE_DOCKER: "1"
          JARVIS_DEVELOPMENT_TEST_IMAGE: jarvis-acquisition-test:ci
          JARVIS_E2E_REPORT_DIR: acquisition-evidence
        run: |
          sudo --preserve-env=JARVIS_E2E_REQUIRE_DOCKER,JARVIS_DEVELOPMENT_TEST_IMAGE,JARVIS_E2E_REPORT_DIR,DOTNET_CLI_TELEMETRY_OPTOUT,POWERSHELL_TELEMETRY_OPTOUT unshare --net -- bash -c '
            ip link set lo up
            exec runuser -u "$1" -- "${@:2}"
          ' _ "$(id -un)" "$(command -v python)" -m pytest tests/test_capability_acquisition_vertical.py -q --junitxml=acquisition-evidence/junit.xml
      - name: Preserve acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-docker-evidence
          path: acquisition-evidence/

  promotion-policy:
    if: always()
    needs:
      - ruff
      - pytest
      - windows-hello-helper
      - windows-dpapi
      - acquisition-docker
    runs-on: ubuntu-latest
    steps:
      - name: Require all promotion validations to succeed
        env:
          ACQUISITION_DOCKER_RESULT: ${{ needs.acquisition-docker.result }}
          RUFF_RESULT: ${{ needs.ruff.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          WINDOWS_HELLO_RESULT: ${{ needs.windows-hello-helper.result }}
          WINDOWS_DPAPI_RESULT: ${{ needs.windows-dpapi.result }}
        run: |
          test "$ACQUISITION_DOCKER_RESULT" = "success"
          test "$RUFF_RESULT" = "success"
          test "$PYTEST_RESULT" = "success"
          test "$WINDOWS_HELLO_RESULT" = "success"
          test "$WINDOWS_DPAPI_RESULT" = "success"
