name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff==0.16.5"

      - name: Check formatting
        run: ruff format --check .

      - name: Check lint
        run: ruff check .

  pytest:
    needs: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preinstall LiveKit BlingFire wheel
        run: >-
          python -m pip install
          "https://files.pythonhosted.org/packages/8f/27/408c435cbed31fa3601ff32ef0499ff594cd898b483c9b4017e9df906de6/livekit_blingfire-1.1.0-cp311-cp311-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl"

      - name: Install JARVIS test dependencies
        run: python -m pip install -e ".[dev,phase45d-acceptance,hands]"

      - name: Provision pinned OPA for production history-policy regressions
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            https://openpolicyagent.org/downloads/v1.0.1/opa_linux_amd64_static \
            --output "$RUNNER_TEMP/jarvis-policy-opa"
          printf '%s  %s\n' 6d81be862e412af910eacfad489e3d77afbfcf4b958ea4e839b7f38c9eec4d87 "$RUNNER_TEMP/jarvis-policy-opa" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/jarvis-policy-opa"

      - name: Run real production history-policy regression
        env:
          JARVIS_TEST_OPA_BINARY: ${{ runner.temp }}/jarvis-policy-opa
          JARVIS_REQUIRE_REAL_OPA: "1"
        run: python -m pytest tests/learning/test_project_history_real_policy.py -q

      - name: Provision Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Smoke Playwright Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              executable = playwright.chromium.executable_path
              browser = playwright.chromium.launch(headless=True)
              browser.close()
              print(f"Playwright Chromium launch ready: {executable}")
          PY

      - name: Run unit tests
        env:
          JARVIS_UI_SCREENSHOTS: ui-screenshots
        run: python -m pytest -q

      - name: Upload opt-in visual UI smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ui-visual-smoke
          path: ui-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  windows-hello-helper:
    # Windows Hello runs in the signed Python runtime (no compiled helper, so
    # nothing for Smart App Control to block). This job runs the real WinRT
    # calls on Windows.
    needs: ruff
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Interface IDs match the Windows SDK headers
        shell: pwsh
        run: |
          $include = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $include) { throw "Windows SDK headers not found" }
          $interop = Join-Path $include.FullName 'um\userconsentverifierinterop.h'
          $winrt = Join-Path $include.FullName 'winrt\windows.security.credentials.ui.h'
          foreach ($h in @($interop, $winrt)) { if (-not (Test-Path $h)) { throw "SDK header missing: $h" } }
          Write-Host "SDK: $($include.Name)"
          $ids = python -I -c "import importlib.util as u; s=u.spec_from_file_location('c','src/jarvis/authority/windows_hello_consent.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.IID_USER_CONSENT_VERIFIER_INTEROP, m.IID_USER_CONSENT_VERIFIER_STATICS, m.IID_ASYNC_VERIFICATION_RESULT, m.IID_ASYNC_AVAILABILITY)"
          $ids = $ids.Trim().Split(' ')
          function Test-Iid([string]$text, [string]$id) {
            # String form ("af4f3f91-...") or DEFINE_GUID form (0xaf4f3f91, 0x564c, 0x4ddc, ...).
            $p = $id.Split('-')
            $numeric = '0x0*{0}\s*,\s*0x0*{1}\s*,\s*0x0*{2}\s*,' -f $p[0], $p[1], $p[2]
            return ($text -match [regex]::Escape($id)) -or ($text -match $numeric)
          }
          $interopText = Get-Content $interop -Raw
          $winrtText = Get-Content $winrt -Raw
          if (-not (Test-Iid $interopText $ids[0])) { throw "IUserConsentVerifierInterop IID $($ids[0]) not in $interop" }
          foreach ($id in $ids[1..3]) {
            if (-not (Test-Iid $winrtText $id)) { throw "IID $id not in $winrt" }
          }
          Write-Host "All four interface IDs match the SDK: $($ids -join ', ')"

      - name: Contract probe (no prompt)
        shell: pwsh
        run: |
          $response = '{}' | python -I src\jarvis\authority\windows_hello_consent.py
          if ($LASTEXITCODE -ne 2) { throw "Expected exit 2, got $LASTEXITCODE" }
          $payload = $response | ConvertFrom-Json
          if ($payload.status -ne 'error' -or $payload.reason -ne 'invalid_request') {
            throw "Contract mismatch: $response"
          }

      - name: Real WinRT availability check (no prompt)
        shell: pwsh
        run: |
          $response = '{"action": "availability"}' | python -I src\jarvis\authority\windows_hello_consent.py
          Write-Host "availability: $response (exit $LASTEXITCODE)"
          if ($LASTEXITCODE -ne 0) { throw "WinRT availability call failed: $response" }
          $payload = $response | ConvertFrom-Json
          if ($payload.status -notin @('available', 'unavailable', 'not_configured')) {
            throw "Unexpected availability: $response"
          }

      - name: Real interop request on an owner window (runner has no Hello device)
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -I -c @"
          import importlib.util as u, time
          s = u.spec_from_file_location('c', 'src/jarvis/authority/windows_hello_consent.py')
          m = u.module_from_spec(s); s.loader.exec_module(m)
          w = m._WinRt(); w.initialize()
          try:
              availability = m.check_availability(w, deadline=time.monotonic() + 60)
              print('availability', availability, m.availability_response(availability))
              if availability == 0:
                  raise SystemExit('runner unexpectedly has Windows Hello; not prompting')
              hwnd = w.owner_window()
              try:
                  value = m.request_verification(w, hwnd, 'JARVIS CI interop check', deadline=time.monotonic() + 90)
              finally:
                  w.destroy_window(hwnd)
              print('interop result', value, m.verification_response(value))
              assert value in (1, 2, 3, 4), value
              assert m.verification_response(value)[0] != 'verified'
          finally:
              w.uninitialize()
          "@
          if ($LASTEXITCODE -ne 0) { throw "Interop request failed" }

  windows-dpapi:
    needs: ruff
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preinstall LiveKit BlingFire wheel
        run: >-
          python -m pip install
          "https://files.pythonhosted.org/packages/2f/12/c826a40b32bfda29e7f826e50dfbd3c0a70726cb8c0cb5023d2311823bd2/livekit_blingfire-1.1.0-cp311-cp311-win_amd64.whl"

      - name: Install unified JARVIS Hands test dependencies
        run: python -m pip install -e ".[dev,hands]"

      - name: Probe Windows Hands Python dependencies
        run: >-
          python -c "import pycaw; import win32clipboard; import win32gui;
          import winrt.windows.foundation; import winrt.windows.foundation.collections;
          import winrt.windows.media.control; import winrt.windows.devices.enumeration;
          import winrt.windows.devices.bluetooth; import screen_brightness_control;
          import send2trash; import docx; import openpyxl; import pptx; import playwright;
          import dulwich; import uroman; import jellyfish;
          print('Unified Windows Hands Python dependencies ready')"

      - name: Run Windows multilingual Hands regressions
        run: >-
          python -m pytest -q
          tests/test_hands_entities.py
          tests/test_hands_contracts.py
          tests/test_hands_generic_grounding.py
          tests/test_windows_hello_utf8.py
          tests/test_windows_hello_builtin.py

      - name: Run Windows sandbox path regressions
        run: >-
          python -m pytest -q
          tests/test_engineering_substrate_sandbox.py::test_pytest_target_cannot_become_docker_or_pytest_option

      - name: Run Windows Phase 6 replay regressions
        run: >-
          python -m pytest -q
          tests/test_incident_repair_evaluation.py
          tests/test_phase6_acceptance.py

      - name: Run Windows DPAPI smoke tests
        run: >-
          python -m pytest -q
          tests/test_windows_dpapi.py
          tests/test_engineering_substrate_secrets_windows.py

      - name: Run Phase 5E disposable secret acceptance
        run: python -m jarvis.engineering_substrate.secrets.acceptance

      - name: Run Windows Self-Repair Job Object smoke tests
        run: python -m pytest -q tests/test_self_repair_windows_job.py

      - name: Run Windows Phase 7 release and promotion regressions
        run: >-
          python -m pytest -q
          tests/test_phase7_promotion_domain.py
          tests/test_phase7_github_evidence.py
          tests/test_phase7_github_app.py
          tests/test_phase7_authority_merge.py
          tests/test_phase7_deployment.py
          tests/test_phase7_release_staging.py
          tests/test_phase7_evaluation.py

      - name: Run non-destructive Windows Phase 7 acceptance harness
        run: python -m jarvis.promotion.acceptance --repo-root .

      - name: Run Windows Phase 8 capability-registry regressions
        run: >-
          python -m pytest -q
          tests/test_capability_registry_contracts.py
          tests/test_capability_registry_store.py
          tests/test_capability_registry_compatibility.py
          tests/test_capability_registry_projection.py
          tests/test_capability_registry_lifecycle.py
          tests/test_capability_registry_retention.py
          tests/test_phase8_evaluation.py

      - name: Run non-destructive Windows Phase 8 acceptance harness
        run: python -m jarvis.capability_registry.acceptance --repo-root .

      - name: Run Windows Phase 9 capability-acquisition replay regressions
        run: >-
          python -m pytest -q
          tests/test_phase9_evaluation.py


  windows-full-pytest:
    needs: ruff
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out clean accepted revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preinstall Windows LiveKit BlingFire wheel
        run: >-
          python -m pip install
          "https://files.pythonhosted.org/packages/2f/12/c826a40b32bfda29e7f826e50dfbd3c0a70726cb8c0cb5023d2311823bd2/livekit_blingfire-1.1.0-cp311-cp311-win_amd64.whl"

      - name: Install Windows JARVIS full-test dependencies
        run: python -m pip install -e ".[dev,phase45d-acceptance,hands]"

      - name: Provision Playwright Chromium
        run: python -m playwright install chromium

      - name: Run full Windows pytest against isolated machine profile
        shell: pwsh
        run: |
          $env:JARVIS_MACHINE_CONFIG = Join-Path $env:RUNNER_TEMP "jarvis-windows-ci-isolated.json"
          python -m pytest -q

  promotion-policy:
    if: always()
    needs:
      - ruff
      - pytest
      - windows-hello-helper
      - windows-dpapi
      - windows-full-pytest
    runs-on: ubuntu-latest
    steps:
      - name: Require all promotion validations to succeed
        env:
          RUFF_RESULT: ${{ needs.ruff.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          WINDOWS_HELLO_RESULT: ${{ needs.windows-hello-helper.result }}
          WINDOWS_DPAPI_RESULT: ${{ needs.windows-dpapi.result }}
          WINDOWS_FULL_PYTEST_RESULT: ${{ needs.windows-full-pytest.result }}
        run: |
          test "$RUFF_RESULT" = "success"
          test "$PYTEST_RESULT" = "success"
          test "$WINDOWS_HELLO_RESULT" = "success"
          test "$WINDOWS_DPAPI_RESULT" = "success"
          test "$WINDOWS_FULL_PYTEST_RESULT" = "success"
