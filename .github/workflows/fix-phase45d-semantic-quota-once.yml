name: Fix Phase 4.5D Semantic Quota Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/fix-phase45d-semantic-quota-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0

      - name: Apply quota-aware Gemini pacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/research/step4_phase45d_semantic_judge_bakeoff.py")
          text = path.read_text(encoding="utf-8")

          old = "import gc\nimport json\nimport time\n"
          new = "import gc\nimport json\nimport re\nimport time\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = 'GEMINI_MODEL_ID = "gemini-3.5-flash-lite"\n'
          new = (
              'GEMINI_MODEL_ID = "gemini-3.5-flash-lite"\n'
              'DEFAULT_GEMINI_BATCH_SIZE = 120\n'
              'DEFAULT_GEMINI_CONCURRENCY = 4\n'
              'DEFAULT_GEMINI_RPM = 12.0\n'
          )
          assert old in text
          text = text.replace(old, new, 1)

          old = '''@dataclass(frozen=True, slots=True)\nclass GeminiBatchResult:\n    judgments: list[GeminiJudgeItem]\n    elapsed_seconds: float\n    usage: dict[str, int]\n\n\ndef _quantiles'''
          new = '''@dataclass(frozen=True, slots=True)\nclass GeminiBatchResult:\n    judgments: list[GeminiJudgeItem]\n    elapsed_seconds: float\n    usage: dict[str, int]\n\n\nclass GeminiRequestPacer:\n    def __init__(self, rpm: float) -> None:\n        if rpm <= 0:\n            raise ValueError("Gemini RPM must be positive")\n        self.interval_seconds = 60.0 / rpm\n        self._lock = asyncio.Lock()\n        self._next_start = 0.0\n\n    async def wait(self) -> None:\n        async with self._lock:\n            now = time.monotonic()\n            delay = max(0.0, self._next_start - now)\n            if delay:\n                await asyncio.sleep(delay)\n            self._next_start = time.monotonic() + self.interval_seconds\n\n\ndef _retry_after_seconds(message: str) -> float | None:\n    match = re.search(\n        r"retry in\\s+([0-9]+(?:\\.[0-9]+)?)s",\n        message,\n        flags=re.IGNORECASE,\n    )\n    return float(match.group(1)) if match else None\n\n\ndef _quantiles'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''async def _call_gemini_batch(\n    client: Any,\n    batch: Sequence[answerability.RetrievalPair],\n    *,\n    semaphore: asyncio.Semaphore,\n) -> GeminiBatchResult:'''
          new = '''async def _call_gemini_batch(\n    client: Any,\n    batch: Sequence[answerability.RetrievalPair],\n    *,\n    semaphore: asyncio.Semaphore,\n    pacer: GeminiRequestPacer,\n) -> GeminiBatchResult:'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        last_error: Exception | None = None\n        for attempt in range(5):\n            started = time.perf_counter()\n            try:'''
          new = '''        last_error: Exception | None = None\n        for attempt in range(5):\n            await pacer.wait()\n            started = time.perf_counter()\n            try:'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            except Exception as exc:\n                last_error = exc\n                message = str(exc).upper()\n                retryable = any(\n                    marker in message\n                    for marker in ("429", "RESOURCE_EXHAUSTED", "503", "UNAVAILABLE")\n                )\n                if not retryable or attempt == 4:\n                    raise\n                await asyncio.sleep(2**attempt)'''
          new = '''            except Exception as exc:\n                last_error = exc\n                raw_message = str(exc)\n                message = raw_message.upper()\n                retryable = any(\n                    marker in message\n                    for marker in ("429", "RESOURCE_EXHAUSTED", "503", "UNAVAILABLE")\n                )\n                if not retryable or attempt == 4:\n                    raise\n                retry_after = _retry_after_seconds(raw_message)\n                retry_delay = max(\n                    float(2**attempt),\n                    pacer.interval_seconds,\n                    (retry_after + 1.0) if retry_after is not None else 0.0,\n                )\n                await asyncio.sleep(retry_delay)'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''async def _score_gemini(\n    pairs: Sequence[answerability.RetrievalPair],\n    *,\n    batch_size: int,\n    concurrency: int,\n) -> tuple[list[GeminiJudgeItem], dict[str, Any]]:'''
          new = '''async def _score_gemini(\n    pairs: Sequence[answerability.RetrievalPair],\n    *,\n    batch_size: int,\n    concurrency: int,\n    rpm: float,\n) -> tuple[list[GeminiJudgeItem], dict[str, Any]]:'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    batches = _batched(pairs, batch_size)\n    semaphore = asyncio.Semaphore(concurrency)\n    started = time.perf_counter()\n    results = await asyncio.gather(\n        *[_call_gemini_batch(client, batch, semaphore=semaphore) for batch in batches]\n    )'''
          new = '''    batches = _batched(pairs, batch_size)\n    semaphore = asyncio.Semaphore(concurrency)\n    pacer = GeminiRequestPacer(rpm)\n    started = time.perf_counter()\n    results = await asyncio.gather(\n        *[\n            _call_gemini_batch(\n                client,\n                batch,\n                semaphore=semaphore,\n                pacer=pacer,\n            )\n            for batch in batches\n        ]\n    )'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        "batch_size": batch_size,\n        "concurrency": concurrency,\n        "wall_seconds": round(elapsed, 4),'''
          new = '''        "batch_size": batch_size,\n        "concurrency": concurrency,\n        "rpm_cap": rpm,\n        "minimum_request_start_interval_seconds": round(pacer.interval_seconds, 4),\n        "wall_seconds": round(elapsed, 4),'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''async def _run(\n    device: str,\n    gemini_batch_size: int,\n    gemini_concurrency: int,\n) -> dict[str, Any]:'''
          new = '''async def _run(\n    device: str,\n    gemini_batch_size: int,\n    gemini_concurrency: int,\n    gemini_rpm: float,\n) -> dict[str, Any]:'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        pairs,\n        batch_size=gemini_batch_size,\n        concurrency=gemini_concurrency,\n    )'''
          new = '''        pairs,\n        batch_size=gemini_batch_size,\n        concurrency=gemini_concurrency,\n        rpm=gemini_rpm,\n    )'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    parser = argparse.ArgumentParser()\n    parser.add_argument("--device", choices=("cuda", "cpu"), default="cuda")\n    parser.add_argument("--gemini-batch-size", type=int, default=8)\n    parser.add_argument("--gemini-concurrency", type=int, default=4)\n    parser.add_argument("--output", default=str(OUTPUT_DEFAULT))'''
          new = '''    parser = argparse.ArgumentParser()\n    parser.add_argument("--device", choices=("cuda", "cpu"), default="cuda")\n    parser.add_argument(\n        "--gemini-batch-size",\n        type=int,\n        default=DEFAULT_GEMINI_BATCH_SIZE,\n    )\n    parser.add_argument(\n        "--gemini-concurrency",\n        type=int,\n        default=DEFAULT_GEMINI_CONCURRENCY,\n    )\n    parser.add_argument("--gemini-rpm", type=float, default=DEFAULT_GEMINI_RPM)\n    parser.add_argument("--output", default=str(OUTPUT_DEFAULT))'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    if args.gemini_concurrency <= 0:\n        raise ValueError("Gemini concurrency must be positive")\n    output_path = Path(args.output)'''
          new = '''    if args.gemini_concurrency <= 0:\n        raise ValueError("Gemini concurrency must be positive")\n    if args.gemini_rpm <= 0:\n        raise ValueError("Gemini RPM must be positive")\n    output_path = Path(args.output)'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            args.device,\n            args.gemini_batch_size,\n            args.gemini_concurrency,\n        )'''
          new = '''            args.device,\n            args.gemini_batch_size,\n            args.gemini_concurrency,\n            args.gemini_rpm,\n        )'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_phase45d_semantic_judge_bakeoff.py")
          tests = test_path.read_text(encoding="utf-8")
          old = '''    assert module.GEMINI_MODEL_ID == "gemini-3.5-flash-lite"\n    assert module.answerability.QWEN_CANDIDATE_WINDOW == 10'''
          new = '''    assert module.GEMINI_MODEL_ID == "gemini-3.5-flash-lite"\n    assert module.DEFAULT_GEMINI_BATCH_SIZE == 120\n    assert module.DEFAULT_GEMINI_CONCURRENCY == 4\n    assert module.DEFAULT_GEMINI_RPM == 12.0\n    assert module.answerability.QWEN_CANDIDATE_WINDOW == 10'''
          assert old in tests
          tests = tests.replace(old, new, 1)

          marker = '''def test_gliclass_margin_is_release_minus_abstain() -> None:\n'''
          addition = '''def test_retry_after_parser_handles_google_quota_hint() -> None:\n    module = _module()\n\n    assert module._retry_after_seconds("Please retry in 20.574368464s.") == pytest.approx(\n        20.574368464\n    )\n    assert module._retry_after_seconds("429 without retry hint") is None\n\n\n'''
          assert marker in tests
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Format and lint scoped files
        shell: bash
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py
          ruff check --fix \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py
          ruff format \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py

      - name: Commit quota-aware harness fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py
          git commit -m "Make semantic judge bakeoff quota aware"
          git push origin HEAD:implementation/step-4-memory-context
