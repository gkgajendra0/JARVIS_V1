name: Stabilization Branch Autoformat

on:
  push:
    branches:
      - fix/runtime-stability-pass

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-stability-pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.16.5"

      - name: Format branch
        run: ruff format .

      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Ruff formatting"
          git push origin HEAD:fix/runtime-stability-pass
