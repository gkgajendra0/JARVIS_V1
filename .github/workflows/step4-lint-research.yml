name: Step 4 research lint cleanup

on:
  push:
    branches:
      - research/step-4-memory-context
    paths:
      - ".github/workflows/step4-lint-research.yml"

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/step-4-memory-context
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Apply Ruff safe fixes to research harnesses
        shell: bash
        run: |
          python -m pip install "ruff==0.16.5"
          files=(
            tools/research/step4_extraction_utf8_runner.py
            tools/research/step4_hybrid_rrf_bakeoff.py
            tools/research/step4_memory_extraction_bakeoff.py
            tools/research/step4_memory_retrieval_bakeoff.py
            tools/research/step4_qwen_memory_optimization_bakeoff.py
            tools/research/step4_qwen_reranker_bakeoff.py
            tools/research/step4_qwen_reranker_precision_bakeoff.py
            tools/research/step4_self_knowledge_probe.py
            tools/research/step4_sqlcipher_dpapi_bakeoff.py
            tools/research/step4_weighted_rrf_bakeoff.py
          )
          ruff check --fix "${files[@]}" || true
          ruff format "${files[@]}"
          git diff --check

      - name: Commit safe lint cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No safe lint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/
          git commit -m "Apply safe Ruff fixes to Step 4 research harnesses"
          git push origin HEAD:research/step-4-memory-context
