name: Add Exact Facet Lookup Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/add-exact-facet-lookup-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/research/_phase45d_add_exact_facet_lookup_once.py
      - run: python -m pip install "ruff==0.16.5"
      - run: |
          ruff format src/jarvis/memory/retrieval.py tools/research/_phase45d_add_exact_facet_lookup_once.py
          ruff check src/jarvis/memory/retrieval.py tools/research/_phase45d_add_exact_facet_lookup_once.py
      - name: Commit exact facet lookup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/memory/retrieval.py tools/research/_phase45d_add_exact_facet_lookup_once.py
          git commit -m "Add exact eligible current facet lookup"
          git push origin HEAD:implementation/step-4-memory-context
