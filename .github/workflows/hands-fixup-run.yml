name: Hands Fixup Run

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hands-autofix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/hands_branch_fixup.py
      - name: Format
        run: |
          python -m pip install ruff==0.16.5
          ruff format .
          ruff check . --fix
      - name: Remove temporary fixup files
        run: |
          rm -f tools/hands_branch_fixup.py
          rm -f .github/workflows/hands-fixup-run.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden and format Hands runtime [hands-autofix]"
          git push origin HEAD:feat/governed-jarvis-hands-v1
