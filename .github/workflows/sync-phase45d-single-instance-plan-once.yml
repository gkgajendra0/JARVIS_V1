name: Sync Phase 4.5D Single Instance Plan Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/sync-phase45d-single-instance-plan-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0

      - name: Synchronize current Phase 4.5D plan
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          path = Path("docs/CURRENT_PLAN.md")
          text = path.read_text(encoding="utf-8")

          old_stage = "**STEP 3 COMPLETE + MERGED — STEP 4 PHASES 4.0A–4.5C COMPLETE — PHASE 4.5D ACTIVE — V1/V2 RELEASE-CONFIDENCE ARCHITECTURES REJECTED — TOP-10 QWEN RETRIEVAL DEVELOPMENT RESULT PASSED — TASK-MATCHED ANSWERABILITY VERIFIER BAKE-OFF NEXT — PHASE 4.5E BLOCKED**"
          new_stage = "**STEP 3 COMPLETE + MERGED — STEP 4 PHASES 4.0A–4.5C COMPLETE — PHASE 4.5D ACTIVE — TOP-10 QWEN DEVELOPMENT RETRIEVAL PASSED — QA + GLICLASS REJECTED — GEMINI BATCH-120 RESULT HAS A PRODUCTION-SHAPE CONFOUND — SINGLE-INSTANCE BOUNDARY DIAGNOSTIC NEXT — PHASE 4.5E BLOCKED**"
          assert old_stage in text
          text = text.replace(old_stage, new_stage, 1)

          section_b64 = ""
          replacement = base64.b64decode(section_b64).decode("utf-8")
          pattern = re.compile(
              r"## Active 4\.5D development direction — ANSWERABILITY VERIFIER\n.*?\n---\n\n## Fresh V3 boundary",
              re.S,
          )
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1

          old_order = "9. **4.5D — ACTIVE: top-10 retrieval diagnosis complete; task-matched multilingual answerability verifier development bake-off next.**"
          new_order = "9. **4.5D — ACTIVE: top-10 retrieval complete; QA/GLiClass rejected; Gemini single-instance boundary diagnostic next.**"
          assert old_order in text
          text = text.replace(old_order, new_order, 1)

          old_bge = "- jump directly to BGE without first evaluating the selected task-matched answerability verifier;"
          new_bge = "- jump to BGE or multilingual NLI before resolving the frozen Gemini single-instance production-shape diagnostic;"
          assert old_bge in text
          text = text.replace(old_bge, new_bge, 1)

          immediate_b64 = ""
          immediate = base64.b64decode(immediate_b64).decode("utf-8")
          immediate_pattern = re.compile(
              r"## Immediate Next Action\n\n\*\*PASS THE ANSWERABILITY VERIFIER DEVELOPMENT HARNESS THROUGH CI ON A CLEAN EXACT SHA, THEN RUN IT ONCE ON THE OWNER RTX\.\*\*\n\nIf the task-matched QA verifier.*?\n\nPhase 4\.5E remains blocked\.",
              re.S,
          )
          text, count = immediate_pattern.subn(immediate, text, count=1)
          assert count == 1

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit synchronized plan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_PLAN.md
          git commit -m "Sync Phase 4.5D single-instance diagnostic plan"
          git push origin HEAD:implementation/step-4-memory-context
