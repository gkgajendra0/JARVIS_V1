name: Format final composite acceptance once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/format-final-composite-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.5"
      - name: Format frozen final composite files
        run: |
          ruff format tools/research/step4_phase45d_final_composite_cases.py tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/step4_phase45d_final_composite_cases.py tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format final composite acceptance files"
          git push origin HEAD:implementation/step-4-memory-context
