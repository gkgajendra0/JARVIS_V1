name: Fix Phase45D GLiClass Sanity Import Once

on:
  push:
    branches:
      - implementation/step-4-memory-context

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply pinned Ruff import fix and validate focused files
        shell: bash
        run: |
          python -m pip install 'ruff==0.16.5' 'pytest>=8,<10'
          ruff check --fix tests/test_phase45d_gliclass_runtime_sanity_v1.py
          ruff format --check tools/research/step4_phase45d_gliclass_runtime_sanity_v1.py tests/test_phase45d_gliclass_runtime_sanity_v1.py
          ruff check tools/research/step4_phase45d_gliclass_runtime_sanity_v1.py tests/test_phase45d_gliclass_runtime_sanity_v1.py
          pytest -q tests/test_phase45d_gliclass_runtime_sanity_v1.py
      - name: Commit Ruff-only change
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Ruff changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_phase45d_gliclass_runtime_sanity_v1.py
          git commit -m 'Apply Ruff import ordering to GLiClass sanity test'
          git push origin HEAD:implementation/step-4-memory-context
