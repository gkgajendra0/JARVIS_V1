name: Format Memory Evidence Gate Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/format-memory-evidence-gate-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "ruff==0.16.5"
      - name: Format new memory gate files
        run: |
          ruff format src/jarvis/memory/retrieval.py tests/test_memory_retrieval_constraints.py
          ruff check --fix src/jarvis/memory/retrieval.py tests/test_memory_retrieval_constraints.py
          ruff format src/jarvis/memory/retrieval.py tests/test_memory_retrieval_constraints.py
          ruff check src/jarvis/memory/retrieval.py tests/test_memory_retrieval_constraints.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/memory/retrieval.py tests/test_memory_retrieval_constraints.py
          git diff --cached --quiet && exit 0
          git commit -m "Format deterministic retrieval constraints"
          git push origin HEAD:implementation/step-4-memory-context
