name: Fix Phase 4.5D Semantic Test Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/fix-phase45d-semantic-test-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0

      - name: Fix float assertion only
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("tests/test_phase45d_semantic_judge_bakeoff.py"); t=p.read_text(encoding="utf-8"); old="from types import ModuleType\n\nROOT ="; new="from types import ModuleType\n\nimport pytest\n\nROOT ="; assert old in t; t=t.replace(old,new,1); old2="assert public[\"gliclass_margin\"] == 0.4"; new2="assert public[\"gliclass_margin\"] == pytest.approx(0.4)"; assert old2 in t; p.write_text(t.replace(old2,new2,1),encoding="utf-8")'

      - name: Commit test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_phase45d_semantic_judge_bakeoff.py
          git commit -m "Fix semantic judge float assertion"
          git push origin HEAD:implementation/step-4-memory-context
