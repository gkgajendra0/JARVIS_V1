name: Finalize Phase 4.5D quota-safe provider boundary exact once

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run exact quota-safe provider boundary patch once'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch exact provider boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/research/step4_phase45d_final_composite_acceptance.py')
          text = path.read_text(encoding='utf-8')

          old = '''class ProviderCallBudgetExceeded(RuntimeError):
              """Raised before a provider call would exceed the certified invocation budget."""


          class PacedMemoryQueryInterpreter:
          '''
          old = old.replace('          class', 'class').replace('              """', '    """')
          new = '''class ProviderCallBudgetExceeded(RuntimeError):
              """Raised before a provider call would exceed the certified invocation budget."""


          class ProviderExecutionPaused(RuntimeError):
              """Raised only when the provider adapter fails after one certified API attempt."""


          class PacedMemoryQueryInterpreter:
          '''
          new = new.replace('          class', 'class').replace('              """', '    """')
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''        await self._pacer.wait()
                  self.logical_calls += 1
                  self.api_attempts += 1
                  proposal = await self._delegate.interpret(text=text, catalog=catalog)
                  self.last_proposal = proposal
                  self.last_attempts = 1
                  return proposal
          '''
          old = old.replace('\n                  ', '\n        ')
          new = '''        await self._pacer.wait()
                  self.logical_calls += 1
                  self.api_attempts += 1
                  self.last_attempts = 1
                  try:
                      proposal = await self._delegate.interpret(text=text, catalog=catalog)
                  except Exception as exc:
                      raise ProviderExecutionPaused(
                          f"provider adapter failed: {type(exc).__name__}"
                      ) from exc
                  self.last_proposal = proposal
                  return proposal
          '''
          new = new.replace('\n                  ', '\n        ').replace('\n                      ', '\n            ').replace('\n                          ', '\n                ')
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''    except Exception as exc:
                  print("STATUS: EXECUTION_PAUSED_PROVIDER")
                  print(
                      "RESUME:",
                      json.dumps(
                          {
                              "checkpoint": str(checkpoint_path),
                              "repository_sha": repository_sha,
                              "error_type": type(exc).__name__,
                          },
                          ensure_ascii=False,
                      ),
                  )
                  raise
          '''
          old = old.replace('\n                  ', '\n        ').replace('\n                      ', '\n            ').replace('\n                          ', '\n                ').replace('\n                              ', '\n                    ')
          new = '''    except ProviderExecutionPaused as exc:
                  print("STATUS: EXECUTION_PAUSED_PROVIDER")
                  print(
                      "RESUME:",
                      json.dumps(
                          {
                              "checkpoint": str(checkpoint_path),
                              "repository_sha": repository_sha,
                              "error_type": (
                                  type(exc.__cause__).__name__
                                  if exc.__cause__ is not None
                                  else type(exc).__name__
                              ),
                          },
                          ensure_ascii=False,
                      ),
                  )
                  raise
          '''
          new = new.replace('\n                  ', '\n        ').replace('\n                      ', '\n            ').replace('\n                          ', '\n                ').replace('\n                              ', '\n                    ').replace('\n                                  ', '\n                        ')
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_phase45d_final_composite_acceptance.py')
          test_text = tests.read_text(encoding='utf-8')
          old = '''    try:
              asyncio.run(interpreter.interpret(text="test", catalog=catalog))
          except RuntimeError as exc:
              assert "429" in str(exc)
          else:
              raise AssertionError("delegate failure should propagate")

              assert delegate.calls == 1
              assert interpreter.logical_calls == 1
              assert interpreter.api_attempts == 1
          '''
          old = old.replace('\n              ', '\n    ')
          new = '''    try:
              asyncio.run(interpreter.interpret(text="test", catalog=catalog))
          except harness.ProviderExecutionPaused as exc:
              assert isinstance(exc.__cause__, RuntimeError)
              assert "429" in str(exc.__cause__)
          else:
              raise AssertionError("provider failure should become a resumable pause")

              assert delegate.calls == 1
              assert interpreter.logical_calls == 1
              assert interpreter.api_attempts == 1
              assert interpreter.last_attempts == 1
          '''
          new = new.replace('\n              ', '\n    ')
          assert test_text.count(old) == 1, test_text.count(old)
          tests.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and lint
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
          ruff check --fix tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
          git commit -m "Finalize quota-safe provider pause boundary"
          git push origin HEAD:implementation/step-4-memory-context
