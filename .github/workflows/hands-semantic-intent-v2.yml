name: Hands semantic intent v2

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply semantic intent refactor
        run: python scripts/hands_semantic_intent_v2_patch.py
      - name: Install dependencies
        run: python -m pip install -e ".[dev,hands]"
      - name: Format and lint
        run: |
          python -m ruff format src/jarvis/voice/hands_goal_tools.py tests/test_hands_goal_tools.py tests/test_production_hands_voice_wiring.py
          python -m ruff check src/jarvis/voice/hands_goal_tools.py tests/test_hands_goal_tools.py tests/test_production_hands_voice_wiring.py
      - name: Focused semantic intent tests
        run: python -m pytest -q tests/test_hands_goal_tools.py tests/test_hands_registry.py tests/test_production_hands_voice_wiring.py tests/test_hands_authority.py
      - name: Commit semantic intent v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/voice/hands_goal_tools.py tests/test_hands_goal_tools.py
          git diff --cached --quiet && exit 0
          git commit -m "Refactor Hands to semantic intent boundary"
          git push origin HEAD:feat/governed-jarvis-hands-v1
