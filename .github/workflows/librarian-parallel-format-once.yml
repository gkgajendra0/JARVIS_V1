name: Librarian Experiment Format Once

on:
  push:
    branches:
      - experiment/librarian-parallel-20261101
    paths:
      - .github/workflows/librarian-parallel-format-once.yml

permissions:
  contents: write

jobs:
  format-experiment-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/librarian-parallel-20261101
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.5
      - name: Ruff format and lint fixes only in isolated experiment
        run: |
          ruff check --fix experiments/librarian_parallel
          ruff format experiments/librarian_parallel
      - name: Commit formatter changes to experiment branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/librarian_parallel
          if ! git diff --cached --quiet; then
            git commit -m "style: format standalone Librarian experiment"
            git push origin HEAD:experiment/librarian-parallel-20261101
          fi
