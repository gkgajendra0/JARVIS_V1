name: Format Phase45D V3 Once

on:
  push:
    branches:
      - implementation/step-4-memory-context

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.5'
      - name: Format V3 research files
        run: |
          ruff format tools/research/step4_phase45d_task_guard_finetune_v3.py tools/research/step4_phase45d_task_guard_finetune_v3_cases.py tests/test_phase45d_task_guard_finetune_v3.py
          ruff check --fix tools/research/step4_phase45d_task_guard_finetune_v3.py tools/research/step4_phase45d_task_guard_finetune_v3_cases.py tests/test_phase45d_task_guard_finetune_v3.py
      - name: Commit formatter-only changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/research/step4_phase45d_task_guard_finetune_v3.py tools/research/step4_phase45d_task_guard_finetune_v3_cases.py tests/test_phase45d_task_guard_finetune_v3.py
          git commit -m 'Format Phase 4.5D fine-tune V3 research files'
          git push origin HEAD:implementation/step-4-memory-context
