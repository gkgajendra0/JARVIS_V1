name: Format Phase45D V3 Once

on:
  push:
    branches:
      - implementation/step-4-memory-context

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.5'
      - name: Finalize V3 pre-run source contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_blob = "77f614d34b94e44277f4bf4bdaffa5da22989268"
          new_blob = "9b8842e1ed4dafd193cd28336f8804be08351da0"

          for name in (
              "tools/research/step4_phase45d_task_guard_finetune_v3.py",
              "tests/test_phase45d_task_guard_finetune_v3.py",
              "docs/research/STEP_4_PHASE_4_5D_TASK_GUARD_FINETUNE_V3_METHOD.md",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old_blob not in text:
                  raise RuntimeError(f"expected old frozen blob not found in {name}")
              path.write_text(text.replace(old_blob, new_blob), encoding="utf-8")

          harness = Path("tools/research/step4_phase45d_task_guard_finetune_v3.py")
          text = harness.read_text(encoding="utf-8")
          old = '''    train_payload = {
              "text": [str(row["query"]) for row in train_rows],
              "labels": [label2id[str(row["label"])] for row in train_rows],
          }
          train_dataset = Dataset.from_dict(train_payload)

          def tokenize_batch(batch: dict[str, list[Any]]) -> dict[str, Any]:
              return tokenizer(
                  [str(value) for value in batch["text"]],
                  truncation=True,
                  max_length=MAX_LENGTH,
              )

          train_dataset = train_dataset.map(
              tokenize_batch,
              batched=True,
              remove_columns=["text"],
              load_from_cache_file=False,
          )
          '''
          new = '''    train_encodings = tokenizer(
              [str(row["query"]) for row in train_rows],
              truncation=True,
              max_length=MAX_LENGTH,
              padding=False,
          )
          train_encodings["labels"] = [
              label2id[str(row["label"])] for row in train_rows
          ]
          train_dataset = Dataset.from_dict(train_encodings)
          '''
          if old not in text:
              raise RuntimeError("expected tokenization block not found")
          harness.write_text(text.replace(old, new), encoding="utf-8")
          PY
          ruff format tools/research/step4_phase45d_task_guard_finetune_v3.py tools/research/step4_phase45d_task_guard_finetune_v3_cases.py tests/test_phase45d_task_guard_finetune_v3.py
          ruff check tools/research/step4_phase45d_task_guard_finetune_v3.py tools/research/step4_phase45d_task_guard_finetune_v3_cases.py tests/test_phase45d_task_guard_finetune_v3.py
      - name: Commit final pre-run V3 source
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/research/step4_phase45d_task_guard_finetune_v3.py tools/research/step4_phase45d_task_guard_finetune_v3_cases.py tests/test_phase45d_task_guard_finetune_v3.py docs/research/STEP_4_PHASE_4_5D_TASK_GUARD_FINETUNE_V3_METHOD.md
          git commit -m 'Finalize Phase 4.5D fine-tune V3 source contract'
          git push origin HEAD:implementation/step-4-memory-context
