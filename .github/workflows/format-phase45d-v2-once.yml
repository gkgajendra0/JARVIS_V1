name: Format Phase 4.5D V2 Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/format-phase45d-v2-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.16.5"

      - name: Format Phase 4.5D V2 files
        run: >-
          ruff format
          tools/research/step4_phase45d_final_v2_cases.py
          tools/research/step4_phase45d_final_v2_acceptance.py
          tests/test_phase45d_final_v2_acceptance.py

      - name: Commit formatter-only changes
        shell: bash
        run: |
          if git diff --quiet -- \
            tools/research/step4_phase45d_final_v2_cases.py \
            tools/research/step4_phase45d_final_v2_acceptance.py \
            tests/test_phase45d_final_v2_acceptance.py; then
            echo "Pinned Ruff reports no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/research/step4_phase45d_final_v2_cases.py \
            tools/research/step4_phase45d_final_v2_acceptance.py \
            tests/test_phase45d_final_v2_acceptance.py
          git commit -m "Format Phase 4.5D V2 research files"
          git push origin HEAD:implementation/step-4-memory-context
