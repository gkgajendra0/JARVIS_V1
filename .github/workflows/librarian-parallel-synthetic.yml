name: Librarian Parallel Adapter (synthetic only)

on:
  push:
    branches:
      - experiment/librarian-parallel-20261101
    paths:
      - experiments/librarian_parallel/**
      - .github/workflows/librarian-parallel-synthetic.yml
  pull_request:
    paths:
      - experiments/librarian_parallel/**
      - .github/workflows/librarian-parallel-synthetic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-mcp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Standalone MCP adapter tests (no secrets, no network service)
        run: python -m unittest discover -s experiments/librarian_parallel -p 'test_*.py' -v
      - name: MCP fixture server handshake and tool discovery
        run: python -m experiments.librarian_parallel.cli --config experiments/librarian_parallel/fixture.example.json discover
      - name: Synthetic memory lifecycle and source-isolation probe
        run: >-
          python -m experiments.librarian_parallel.scenario_runner
          --config experiments/librarian_parallel/fixture.example.json
          --output "${RUNNER_TEMP}/synthetic_librarian_probe.json"
          --allow-synthetic-write
      - name: Synthetic seven-event sidecar replay
        run: >-
          python -m experiments.librarian_parallel.sidecar
          --config experiments/librarian_parallel/fixture.example.json
          --events experiments/librarian_parallel/fixtures/fictional-nepal.jsonl
          --output "${RUNNER_TEMP}/synthetic_librarian_sidecar.json"
          --allow-synthetic-write
      - name: Synthetic read smoke
        run: python -m experiments.librarian_parallel.cli --config experiments/librarian_parallel/fixture.example.json invoke --operation recall --project synthetic-nepal --query vehicle
