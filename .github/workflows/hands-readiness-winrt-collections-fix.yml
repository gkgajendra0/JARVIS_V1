name: Hands WinRT Collections readiness fix

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1
    paths:
      - .github/workflows/hands-readiness-winrt-collections-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add WinRT Foundation Collections readiness dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/jarvis/computer/hands_integrated_acceptance.py')
          text = source.read_text(encoding='utf-8')
          anchor = '''_WINDOWS_REQUIRED_MODULES = {
              "screen_brightness_control": "Windows display control",
              "winrt.windows.devices.enumeration": "Windows device enumeration",
              "winrt.windows.devices.bluetooth": "Windows Bluetooth control",
          }'''
          replacement = '''_WINDOWS_REQUIRED_MODULES = {
              "screen_brightness_control": "Windows display control",
              "winrt.windows.foundation.collections": "Windows Runtime Foundation Collections",
              "winrt.windows.devices.enumeration": "Windows device enumeration",
              "winrt.windows.devices.bluetooth": "Windows Bluetooth control",
          }'''
          if text.count(anchor) != 1:
              raise SystemExit('integrated readiness dependency anchor missing or ambiguous')
          source.write_text(text.replace(anchor, replacement), encoding='utf-8')

          tests = Path('tests/test_hands_integrated_acceptance.py')
          text = tests.read_text(encoding='utf-8')
          test_name = 'def test_integrated_windows_readiness_requires_winrt_foundation_collections('
          if test_name not in text:
              anchor = '\ndef test_integrated_operation_map_excludes_only_owner_enabled_visual_fallback() -> None:'
              if anchor not in text:
                  raise SystemExit('integrated test insertion anchor missing')
              regression = '''\ndef test_integrated_windows_readiness_requires_winrt_foundation_collections(monkeypatch) -> None:
              monkeypatch.setattr(acceptance.platform, "system", lambda: "Windows")
              seen: list[str] = []

              def finder(name: str) -> bool:
                  seen.append(name)
                  return name != "winrt.windows.foundation.collections"

              checks = acceptance._dependency_checks(finder=finder)
              by_name = {check.name: check for check in checks}
              missing = by_name[
                  "Hands dependency: Windows Runtime Foundation Collections"
              ]

              assert missing.ok is False
              assert missing.detail == (
                  "missing Python module: winrt.windows.foundation.collections"
              )
              assert "winrt.windows.foundation.collections" in seen

          '''
              text = text.replace(anchor, regression + anchor, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Format and test changed files
        run: |
          python -m pip install -e ".[dev]"
          ruff format src/jarvis/computer/hands_integrated_acceptance.py tests/test_hands_integrated_acceptance.py
          ruff check --fix src/jarvis/computer/hands_integrated_acceptance.py tests/test_hands_integrated_acceptance.py
          python -m pytest -q tests/test_hands_integrated_acceptance.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/jarvis/computer/hands_integrated_acceptance.py tests/test_hands_integrated_acceptance.py
          git diff --cached --check
          git commit -m 'Require WinRT Foundation Collections in Hands readiness'
          git push origin HEAD:feat/governed-jarvis-hands-v1
