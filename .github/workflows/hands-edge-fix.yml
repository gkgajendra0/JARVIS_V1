name: Hands Edge Hardening

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[hands-edge-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded edge fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'expected one anchor in {path}, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/jarvis/capabilities/local_writes.py',
              '''        configured: dict[str, pathlib.Path] = (\n            _default_write_roots() if include_user_defaults else {}\n        )\n        configured.update(_parse_extra_roots(os.getenv("JARVIS_LOCAL_WRITE_ROOTS")))\n        for alias, value in (roots or {}).items():\n            normalized = str(alias).strip().casefold()\n            if not re.fullmatch(r"[a-z][a-z0-9_-]{0,31}", normalized):\n                raise LocalWriteValidationError("invalid local write root alias")\n            configured[normalized] = pathlib.Path(value).expanduser().resolve()\n\n        protected = pathlib.Path(jarvis_root or default_project_root()).resolve()\n        if not configured:\n            raise LocalWriteValidationError(\n                "no approved local write roots are configured"\n            )\n        for alias, root in configured.items():\n            if not root.is_dir():\n                raise LocalWriteValidationError(\n                    f"approved local write root does not exist: {alias}"\n                )\n            if _is_within(root, protected) or _is_within(protected, root):\n                raise LocalWriteValidationError(\n                    "JARVIS project/source tree cannot be an ordinary local write root"\n                )\n        self._roots = configured''',
              '''        protected = pathlib.Path(jarvis_root or default_project_root()).resolve()\n        defaults = _default_write_roots() if include_user_defaults else {}\n        configured = {\n            alias: root\n            for alias, root in defaults.items()\n            if not (_is_within(root, protected) or _is_within(protected, root))\n        }\n\n        explicit = _parse_extra_roots(os.getenv("JARVIS_LOCAL_WRITE_ROOTS"))\n        for alias, value in (roots or {}).items():\n            normalized = str(alias).strip().casefold()\n            if not re.fullmatch(r"[a-z][a-z0-9_-]{0,31}", normalized):\n                raise LocalWriteValidationError("invalid local write root alias")\n            explicit[normalized] = pathlib.Path(value).expanduser().resolve()\n\n        for alias, root in explicit.items():\n            if not root.is_dir():\n                raise LocalWriteValidationError(\n                    f"approved local write root does not exist: {alias}"\n                )\n            if _is_within(root, protected) or _is_within(protected, root):\n                raise LocalWriteValidationError(\n                    "JARVIS project/source tree cannot be an ordinary local write root"\n                )\n            configured[alias] = root\n\n        if not configured:\n            raise LocalWriteValidationError(\n                "no approved local write roots are configured"\n            )\n        self._roots = configured''',
          )

          local_tests = Path('tests/test_local_write_capabilities.py')
          text = local_tests.read_text(encoding='utf-8')
          anchor = '''def test_write_policy_blocks_traversal_and_secret_paths(tmp_path: Path) -> None:\n'''
          addition = '''def test_write_policy_skips_only_overlapping_default_root(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    documents = tmp_path / "Documents"\n    documents.mkdir()\n    downloads = tmp_path / "Downloads"\n    downloads.mkdir()\n    jarvis = documents / "JARVIS_V1"\n    jarvis.mkdir()\n    monkeypatch.setattr(\n        "jarvis.capabilities.local_writes._default_write_roots",\n        lambda: {"documents": documents, "downloads": downloads},\n    )\n\n    policy = ApprovedWriteRootPolicy(jarvis_root=jarvis)\n\n    assert policy.aliases == ("downloads",)\n\n\n'''
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('local write test anchor missing')
              local_tests.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')

          replace_once(
              'src/jarvis/capabilities/software_management.py',
              'import re\nimport shutil',
              'import os\nimport re\nimport shutil',
          )
          replace_once(
              'src/jarvis/capabilities/software_management.py',
              '''class WinGetBackend:\n    @staticmethod\n    def _exe() -> str:''',
              '''class WinGetBackend:\n    @staticmethod\n    def available() -> bool:\n        return os.name == "nt" and shutil.which("winget") is not None\n\n    @staticmethod\n    def _exe() -> str:''',
          )
          replace_once(
              'src/jarvis/capabilities/software_management.py',
              '''    def __init__(self, backend: SoftwareBackend | None = None) -> None:\n        self._backend = backend or WinGetBackend()\n        self.descriptor = CapabilityDescriptor.create(''',
              '''    def __init__(self, backend: SoftwareBackend | None = None) -> None:\n        backend_provided = backend is not None\n        self._backend = backend or WinGetBackend()\n        execution_enabled = backend_provided or WinGetBackend.available()\n        self.descriptor = CapabilityDescriptor.create(''',
          )
          replace_once(
              'src/jarvis/capabilities/software_management.py',
              '''            metadata={"backend": "Microsoft WinGet", "shell": False},\n            execution_enabled=True,''',
              '''            metadata={\n                "backend": "Microsoft WinGet",\n                "shell": False,\n                "available": execution_enabled,\n            },\n            execution_enabled=execution_enabled,''',
          )

          Path('tests/test_software_management.py').write_text('''from __future__ import annotations\n\nfrom typing import Any\n\nfrom jarvis.capabilities.software_management import (\n    SoftwareManagementExecutor,\n    WinGetBackend,\n)\n\n\nclass FakeBackend:\n    def search(self, query: str) -> dict[str, Any]:\n        return {"returncode": 0, "query": query}\n\n    def list_installed(self, query: str) -> dict[str, Any]:\n        return {"returncode": 0, "query": query}\n\n    def install(self, package_id: str) -> dict[str, Any]:\n        return {"returncode": 0, "package_id": package_id}\n\n    def uninstall(self, package_id: str) -> dict[str, Any]:\n        return {"returncode": 0, "package_id": package_id}\n\n    def is_installed(self, package_id: str) -> bool:\n        del package_id\n        return True\n\n\ndef test_default_software_descriptor_reflects_winget_availability(monkeypatch) -> None:\n    monkeypatch.setattr(WinGetBackend, "available", staticmethod(lambda: False))\n\n    executor = SoftwareManagementExecutor()\n\n    assert executor.descriptor.execution_enabled is False\n    assert executor.descriptor.metadata["available"] is False\n\n\ndef test_injected_software_backend_is_execution_enabled() -> None:\n    executor = SoftwareManagementExecutor(FakeBackend())\n\n    assert executor.descriptor.execution_enabled is True\n    assert executor.descriptor.metadata["available"] is True\n''', encoding='utf-8')
          PY
      - name: Format, lint and regress
        run: |
          python -m pip install ruff==0.16.5
          python -m pip install -e ".[dev,phase45d-acceptance,hands-files,hands-documents,browser-hands,development-hands]"
          ruff format src/jarvis/setup.py src/jarvis/capabilities/local_writes.py src/jarvis/capabilities/software_management.py tests/test_local_write_capabilities.py tests/test_software_management.py
          ruff check src/jarvis/setup.py src/jarvis/capabilities/local_writes.py src/jarvis/capabilities/software_management.py tests/test_local_write_capabilities.py tests/test_software_management.py
          python -m pytest -q tests/test_local_write_capabilities.py tests/test_software_management.py tests/test_setup_playwright.py tests/test_capability_runtime.py tests/test_hands_registry.py tests/test_hands_goal_tools.py
      - name: Commit edge hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/setup.py src/jarvis/capabilities/local_writes.py src/jarvis/capabilities/software_management.py tests/test_local_write_capabilities.py tests/test_software_management.py
          git diff --cached --quiet && exit 0
          git commit -m "Close Hands write-root and availability edges [hands-edge-fix]"
          git push origin HEAD:feat/governed-jarvis-hands-v1
