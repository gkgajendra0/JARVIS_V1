name: Hands natural app launch repair

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch natural app-launch grounding
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("src/jarvis/voice/hands_goal_tools.py")
          text = path.read_text(encoding="utf-8")

          old = '    "open_app": ("open", "launch", "start"),\n'
          if text.count(old) != 1:
              raise SystemExit("open app intent anchor mismatch")
          text = text.replace(
              old,
              '    "open_app": ("open", "launch", "start", "play"),\n',
              1,
          )

          software_pattern = re.compile(
              r'    "search_software": \(\n(?:        "[^"]+",\n)+    \),'
          )
          software_replacement = '''    "search_software": (
              "winget",
              "win get",
              "wing it",
              "search software",
              "search package",
              "find software",
              "find package",
              "look for software",
              "look for package",
              "install",
          ),'''
          text, count = software_pattern.subn(software_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"software discovery intent anchor mismatch: {count}")

          natural_leads = '''_NATURAL_ACTION_LEADS = (
              "i want to",
              "i d like to",
              "i would like to",
              "i would love to",
              "can you",
              "could you",
              "would you",
              "will you",
              "please",
          )


          '''
          marker = "_HINGLISH_REQUEST_SUFFIXES = (\n"
          if text.count(marker) != 1:
              raise SystemExit("natural action lead anchor mismatch")
          text = text.replace(marker, natural_leads + marker, 1)

          function_pattern = re.compile(
              r'def _explicit_action_request\(text: str\) -> bool:\n.*?\n\n\ndef _require_material',
              re.DOTALL,
          )
          function_replacement = '''def _starts_with_action(value: str) -> bool:
              return any(
                  value == start or value.startswith(f"{start} ")
                  for start in _ACTION_STARTS
              )


          def _explicit_action_request(text: str) -> bool:
              body = _strip_request_prefixes(text)
              if not body:
                  return False
              if _starts_with_action(body):
                  return True
              for lead in _NATURAL_ACTION_LEADS:
                  match = re.search(rf"(?:^| ){re.escape(lead)}(?: |$)", body)
                  if match is None:
                      continue
                  remainder = body[match.end() :].strip()
                  if remainder.startswith("please "):
                      remainder = remainder[len("please ") :].strip()
                  if _starts_with_action(remainder):
                      return True
              return any(
                  body == suffix or body.endswith(f" {suffix}")
                  for suffix in _HINGLISH_REQUEST_SUFFIXES
              )


          def _require_material'''
          text, count = function_pattern.subn(function_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"explicit action grammar anchor mismatch: {count}")

          guidance_pattern = re.compile(
              r'        Prefer native semantic operations over UI\. Generic play/pause/next/previous/stop\n'
              r'        for the already-active Windows media session should use the media operations\.\n'
          )
          guidance_replacement = '''        Prefer native semantic operations over UI. To start/open/play a named installed local
              application or game, use `open_app` directly; `open_app` already resolves against
              the Windows installed-app catalogue. Never use `search_software` merely to locate
              something the USER asked to launch. `search_software` is for explicit WinGet/software
              discovery, or as the discovery step of an explicit install request. Generic
              play/pause/next/previous/stop for the already-active Windows media session should use
              the media operations.
          '''
          text, count = guidance_pattern.subn(guidance_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"app launch guidance anchor mismatch: {count}")
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_hands_goal_tools.py")
          tests = test_path.read_text(encoding="utf-8")
          if "test_voice_natural_desire_form_authorizes_named_game_launch" in tests:
              raise SystemExit("natural app launch regressions already present")
          tests += '''

          def test_voice_natural_desire_form_authorizes_named_game_launch() -> None:
              grounded = parse(
                  tools("Jarvis, I want to play FIFA."),
                  "open_app",
                  {"app": "FIFA"},
              )
              assert grounded == {"app": "FIFA"}


          def test_voice_embedded_polite_request_authorizes_named_game_launch() -> None:
              grounded = parse(
                  tools("Jarvis, I want to play FIFA. Could you please start it?"),
                  "open_app",
                  {"app": "FIFA"},
              )
              assert grounded == {"app": "FIFA"}


          def test_app_launch_request_does_not_warrant_software_discovery() -> None:
              with pytest.raises(
                  HandsGoalGroundingError,
                  match="does not warrant Hands operation: search_software",
              ):
                  parse(
                      tools("Jarvis please open Spotify app"),
                      "search_software",
                      {"query": "Spotify"},
                  )


          def test_explicit_software_discovery_is_still_warranted() -> None:
              grounded = parse(
                  tools("Jarvis search software for Spotify"),
                  "search_software",
                  {"query": "Spotify"},
              )
              assert grounded == {"query": "Spotify"}
          '''
          test_path.write_text(tests, encoding="utf-8")
      - name: Install targeted dependencies
        run: python -m pip install -e ".[dev,hands]"
      - name: Format and lint
        run: |
          python -m ruff format src/jarvis/voice/hands_goal_tools.py tests/test_hands_goal_tools.py
          python -m ruff check src/jarvis/voice/hands_goal_tools.py tests/test_hands_goal_tools.py
      - name: Focused regressions
        run: python -m pytest -q tests/test_hands_goal_tools.py tests/test_hands_registry.py tests/test_production_hands_voice_wiring.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/voice/hands_goal_tools.py tests/test_hands_goal_tools.py
          git diff --cached --quiet && exit 0
          git commit -m "Accept natural installed app launch requests"
          git push origin HEAD:feat/governed-jarvis-hands-v1
