name: Hands voice live-gate repair v2

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch live voice boundary
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          path = Path("src/jarvis/voice/hands_goal_tools.py")
          text = path.read_text(encoding="utf-8")

          alias_block = dedent('''
          _OPERATION_ALIASES = {
              "set_volume": "set_master_volume",
              "get_volume": "get_master_volume",
              "mute_volume": "mute_master_volume",
              "unmute_volume": "unmute_master_volume",
              "create_file": "create_text_file",
              "write_file": "create_text_file",
              "list_bluetooth": "list_bluetooth_devices",
              "get_bluetooth_devices": "list_bluetooth_devices",
              "winget_search": "search_software",
              "search_winget": "search_software",
              "software_search": "search_software",
              "git_repo_status": "git_status",
          }
          ''').lstrip()
          text = once(
              text,
              "_MAX_APP_CHARS = 160\n",
              "_MAX_APP_CHARS = 160\n" + alias_block,
              "operation aliases",
          )

          text = once(
              text,
              '    "create_text_file": ("create file", "make file", "new file", "write file"),\n',
              '    "create_text_file": (\n'
              '        "create file",\n'
              '        "create a file",\n'
              '        "create text file",\n'
              '        "create a text file",\n'
              '        "make file",\n'
              '        "new file",\n'
              '        "write file",\n'
              '    ),\n',
              "file intent markers",
          )
          text = once(
              text,
              '    "search_software": ("software", "app", "package", "winget", "install"),\n',
              '    "search_software": (\n'
              '        "software",\n'
              '        "app",\n'
              '        "package",\n'
              '        "winget",\n'
              '        "win get",\n'
              '        "wing it",\n'
              '        "search software",\n'
              '        "search package",\n'
              '        "install",\n'
              '    ),\n',
              "software intent markers",
          )

          text = once(
              text,
              '    "jarvis",\n    "please",\n',
              '    "jarvis",\n'
              '    "hey javis",\n'
              '    "okay javis",\n'
              '    "ok javis",\n'
              '    "javis",\n'
              '    "yeah",\n'
              '    "yes",\n'
              '    "okay",\n'
              '    "ok",\n'
              '    "so",\n'
              '    "alright",\n'
              '    "all right",\n'
              '    "please",\n',
              "request prefixes",
          )

          spoken_helper = dedent('''
          def _spoken_punctuation_normalized(value: object) -> str:
              text = str(value).casefold()
              for symbol, spoken in (
                  ("\\\\", " backslash "),
                  ("/", " slash "),
                  ("_", " underscore "),
                  ("-", " dash "),
                  (".", " dot "),
              ):
                  text = text.replace(symbol, spoken)
              return " ".join(re.sub(r"[^\\w]+", " ", text).split())


          ''')
          text = once(
              text,
              "def _contains_marker(text: str, markers: tuple[str, ...]) -> bool:\n",
              spoken_helper + "def _contains_marker(text: str, markers: tuple[str, ...]) -> bool:\n",
              "spoken punctuation helper",
          )

          text = once(
              text,
              "def _material_in_text(value: object, text: str) -> bool:\n    material = _normalized(value)\n    return bool(material) and material in _normalized(text)\n",
              "def _material_in_text(value: object, text: str) -> bool:\n"
              "    material = _normalized(value)\n"
              "    normalized_text = _normalized(text)\n"
              "    if bool(material) and material in normalized_text:\n"
              "        return True\n"
              "    spoken_material = _spoken_punctuation_normalized(value)\n"
              "    return bool(spoken_material) and spoken_material in normalized_text\n",
              "material grounding",
          )

          text = once(
              text,
              '        operation = str(raw.get("operation", "")).strip()\n',
              '        requested_operation = str(raw.get("operation", "")).strip().casefold()\n'
              '        operation = _OPERATION_ALIASES.get(requested_operation, requested_operation)\n',
              "operation canonicalization",
          )

          guidance_old = (
              '        Each item is {"operation": "...", "parameters": {...}}. Semantic operations\n'
              '        cover apps/windows/audio/media/clipboard plus governed files and documents,\n'
              '        structured Playwright browser work, display/Bluetooth/power controls, bounded\n'
              '        WinGet software management and Dulwich Git development work.\n'
          )
          guidance_new = (
              '        Each item is {"operation": "...", "parameters": {...}}. Use canonical\n'
              '        operation names, not friendly synonyms. In particular: `open_app`,\n'
              '        `get_master_volume`, `set_master_volume`, `mute_master_volume`,\n'
              '        `unmute_master_volume`, `create_text_file`, `replace_text_file`,\n'
              '        `append_text_file`, `make_directory`, `create_docx`, `create_xlsx`,\n'
              '        `create_pptx`, `execute_browser_plan`, `list_displays`,\n'
              '        `get_display_brightness`, `set_display_brightness`,\n'
              '        `list_bluetooth_devices`, `pair_bluetooth_device`,\n'
              '        `unpair_bluetooth_device`, `search_software`, `list_installed_software`,\n'
              '        `install_package`, `uninstall_package`, `git_status`, `git_active_branch`,\n'
              '        `git_create_branch`, `git_stage_paths`, `git_commit`, and\n'
              '        `git_push_current`. Do not invent names such as `set_volume` or\n'
              '        `create_file`; compatibility aliases are only a fail-safe at the boundary.\n'
          )
          text = once(text, guidance_old, guidance_new, "tool operation guidance")
          path.write_text(text, encoding="utf-8")

          path = Path("src/jarvis/voice/production_runtime.py")
          text = path.read_text(encoding="utf-8")
          text = once(
              text,
              '    visual_hands = capability_catalog.by_key("visual:desktop.control")\n',
              '    visual_hands = capability_catalog.by_key("visual:desktop.control")\n'
              '    browser_hands = capability_catalog.by_key("browser:playwright")\n',
              "production browser descriptor",
          )
          text = once(
              text,
              '        "structured_desktop_control=%s visual_fallback=%s browser_control=False "\n',
              '        "structured_desktop_control=%s visual_fallback=%s browser_control=%s "\n',
              "production browser log format",
          )
          text = once(
              text,
              '        bool(visual_hands and visual_hands.execution_enabled),\n    )\n',
              '        bool(visual_hands and visual_hands.execution_enabled),\n'
              '        bool(browser_hands and browser_hands.execution_enabled),\n'
              '    )\n',
              "production browser log value",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/jarvis/voice/canonical_active_speaker_runtime.py")
          text = path.read_text(encoding="utf-8")
          text = once(
              text,
              '        if capability_runtime is not None:\n            LOGGER.info(\n',
              '        if capability_runtime is not None:\n'
              '            capability_catalog = capability_runtime.refresh_catalog()\n'
              '            browser_hands = capability_catalog.by_key("browser:playwright")\n'
              '            LOGGER.info(\n',
              "active browser descriptor",
          )
          text = once(
              text,
              '                "browser_control=False | raw_shell=False"\n            )\n',
              '                "browser_control=%s | raw_shell=False",\n'
              '                bool(browser_hands and browser_hands.execution_enabled),\n'
              '            )\n',
              "active browser log",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_hands_goal_tools.py")
          text = path.read_text(encoding="utf-8")
          if "test_live_voice_aliases_and_transcription_fillers_are_canonicalized" in text:
              raise SystemExit("voice regression tests already present")
          addition = dedent('''

          def test_live_voice_aliases_and_transcription_fillers_are_canonicalized() -> None:
              tool = tools("Javis open calculator and set my master volume to 90 percent")
              plan = json.dumps(
                  [
                      {"operation": "open_app", "parameters": {"app": "calculator"}},
                      {"operation": "set_volume", "parameters": {"percent": 90}},
                  ]
              )
              steps = tool._parse_plan(plan, tool._latest_user_turn().text)
              assert [step.operation for step in steps] == [
                  "open_app",
                  "set_master_volume",
              ]
              assert steps[1].parameters == {"percent": 90.0}


          def test_voice_file_alias_accepts_spoken_dot_without_weakening_content_grounding() -> None:
              tool = tools(
                  "So create a text file in Downloads named voice test dot txt with text hello world"
              )
              plan = json.dumps(
                  [
                      {
                          "operation": "create_file",
                          "parameters": {
                              "root": "downloads",
                              "path": "voice test.txt",
                              "text": "hello world",
                          },
                      }
                  ]
              )
              step = tool._parse_plan(plan, tool._latest_user_turn().text)[0]
              assert step.operation == "create_text_file"
              assert step.parameters == {
                  "root": "downloads",
                  "path": "voice test.txt",
                  "text": "hello world",
              }


          def test_voice_winget_transcription_variant_warrants_non_mutating_search() -> None:
              tool = tools(
                  "Yeah could you list my Bluetooth devices and search Wing It for PowerToys"
              )
              plan = json.dumps(
                  [
                      {"operation": "list_bluetooth_devices", "parameters": {}},
                      {
                          "operation": "winget_search",
                          "parameters": {"query": "PowerToys"},
                      },
                  ]
              )
              steps = tool._parse_plan(plan, tool._latest_user_turn().text)
              assert [step.operation for step in steps] == [
                  "list_bluetooth_devices",
                  "search_software",
              ]
              assert steps[1].parameters == {"query": "PowerToys"}
          ''')
          path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")

      - name: Install targeted dependencies
        run: python -m pip install -e ".[dev,hands]"
      - name: Format and lint
        run: |
          python -m ruff format src/jarvis/voice/hands_goal_tools.py src/jarvis/voice/production_runtime.py src/jarvis/voice/canonical_active_speaker_runtime.py tests/test_hands_goal_tools.py
          python -m ruff check src/jarvis/voice/hands_goal_tools.py src/jarvis/voice/production_runtime.py src/jarvis/voice/canonical_active_speaker_runtime.py tests/test_hands_goal_tools.py
      - name: Focused regressions
        run: python -m pytest -q tests/test_hands_goal_tools.py tests/test_production_hands_voice_wiring.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/voice/hands_goal_tools.py src/jarvis/voice/production_runtime.py src/jarvis/voice/canonical_active_speaker_runtime.py tests/test_hands_goal_tools.py
          git diff --cached --quiet && exit 0
          git commit -m "Harden Hands voice planning against live transcription"
          git push origin HEAD:feat/governed-jarvis-hands-v1
