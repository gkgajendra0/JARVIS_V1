name: Startup and Recenter Hotfix Applicator V2

on:
  push:
    branches:
      - fix/runtime-stability-pass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-stability-pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply guarded startup/recenter patch
        run: python .github/scripts/apply_startup_recenter_hotfix.py

      - name: Format and lint touched files
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format src/jarvis/voice/runtime.py src/jarvis/voice/production_runtime.py src/jarvis/vision/native_owner_tracking.py src/jarvis/vision/pocket3_recovery.py tests/test_voice_runtime.py tests/test_native_owner_tracking.py tests/test_pocket3_recovery.py
          ruff check src/jarvis/voice/runtime.py src/jarvis/voice/production_runtime.py src/jarvis/vision/native_owner_tracking.py src/jarvis/vision/pocket3_recovery.py tests/test_voice_runtime.py tests/test_native_owner_tracking.py tests/test_pocket3_recovery.py
          python -m compileall -q src tests

      - name: Install focused test dependencies
        run: python -m pip install -e ".[dev,phase45d-acceptance,hands]"

      - name: Run focused regressions
        run: python -m pytest -q tests/test_voice_runtime.py tests/test_native_owner_tracking.py tests/test_pocket3_recovery.py

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/voice/runtime.py src/jarvis/voice/production_runtime.py src/jarvis/vision/native_owner_tracking.py src/jarvis/vision/pocket3_recovery.py tests/test_voice_runtime.py tests/test_native_owner_tracking.py tests/test_pocket3_recovery.py
          git commit -m "Gate greeting on Pocket lock and sequence recenter"
          git push origin HEAD:fix/runtime-stability-pass
