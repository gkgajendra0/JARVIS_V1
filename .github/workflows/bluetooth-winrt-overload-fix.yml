name: Bluetooth WinRT overload fix

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1
    paths:
      - .github/workflows/bluetooth-winrt-overload-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply projection-specific Bluetooth enumeration fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/jarvis/capabilities/windows_devices.py')
          text = source.read_text(encoding='utf-8')
          old = '''class WinRtBluetoothBackend:
              @staticmethod
              async def _devices():
                  try:
                      from winrt.windows.devices.bluetooth import BluetoothDevice
                      from winrt.windows.devices.enumeration import DeviceInformation
                  except ImportError as exc:
                      raise WindowsDeviceValidationError(
                          "Bluetooth Hands requires the jarvis[device-hands] extra"
                      ) from exc
                  selector = BluetoothDevice.get_device_selector()
                  return list(await DeviceInformation.find_all_async(selector))
          '''
          new = '''class WinRtBluetoothBackend:
              @staticmethod
              async def _enumerate_with_aqs(bluetooth_device_type, device_information_type):
                  selector = bluetooth_device_type.get_device_selector()
                  return list(
                      await device_information_type.find_all_async_aqs_filter(selector)
                  )

              @classmethod
              async def _devices(cls):
                  try:
                      from winrt.windows.devices.bluetooth import BluetoothDevice
                      from winrt.windows.devices.enumeration import DeviceInformation
                  except ImportError as exc:
                      raise WindowsDeviceValidationError(
                          "Bluetooth Hands requires the jarvis[device-hands] extra"
                      ) from exc
                  return await cls._enumerate_with_aqs(BluetoothDevice, DeviceInformation)
          '''
          if text.count(old) != 1:
              raise SystemExit('Bluetooth source anchor missing or ambiguous')
          source.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_windows_device_capabilities.py')
          text = tests.read_text(encoding='utf-8')
          future = 'from __future__ import annotations\n\n'
          if 'import asyncio\n' not in text:
              if future not in text:
                  raise SystemExit('test import anchor missing')
              text = text.replace(future, future + 'import asyncio\n\n', 1)
          import_anchor = '''    PowerSessionExecutor,\n)'''
          import_replacement = '''    PowerSessionExecutor,\n    WinRtBluetoothBackend,\n)'''
          if '    WinRtBluetoothBackend,\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('Bluetooth test import anchor missing')
              text = text.replace(import_anchor, import_replacement, 1)
          test_name = 'def test_winrt_bluetooth_uses_named_aqs_overload() -> None:'
          if test_name not in text:
              anchor = '\ndef test_bluetooth_listing_is_private_read() -> None:'
              if anchor not in text:
                  raise SystemExit('Bluetooth test insertion anchor missing')
              regression = '''\ndef test_winrt_bluetooth_uses_named_aqs_overload() -> None:
              calls: list[str] = []

              class BluetoothDevice:
                  @staticmethod
                  def get_device_selector() -> str:
                      return "bluetooth-aqs"

              class DeviceInformation:
                  @staticmethod
                  async def find_all_async_aqs_filter(selector: str):
                      calls.append(selector)
                      return ["device"]

                  @staticmethod
                  async def find_all_async(*_args):
                      raise AssertionError("zero-argument projection overload must not be used")

              result = asyncio.run(
                  WinRtBluetoothBackend._enumerate_with_aqs(
                      BluetoothDevice,
                      DeviceInformation,
                  )
              )

              assert result == ["device"]
              assert calls == ["bluetooth-aqs"]

          '''
              text = text.replace(anchor, regression + anchor, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Format changed Python files
        run: |
          python -m pip install 'ruff==0.16.5'
          ruff format src/jarvis/capabilities/windows_devices.py tests/test_windows_device_capabilities.py
          ruff check --fix src/jarvis/capabilities/windows_devices.py tests/test_windows_device_capabilities.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/jarvis/capabilities/windows_devices.py tests/test_windows_device_capabilities.py
          git diff --cached --check
          git commit -m 'Fix WinRT Bluetooth AQS overload projection'
          git push origin HEAD:feat/governed-jarvis-hands-v1
