name: Format Phase 4.5D task guard once

on:
  push:
    paths:
      - .github/workflows/format-phase45d-task-guard-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.5"
      - name: Fix exact lint issue and format exact files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/research/step4_phase45d_task_specific_guard_bakeoff.py")
          text = path.read_text(encoding="utf-8")
          old = 'raise RuntimeError(f"{split} corpus must be a list")'
          new = 'raise TypeError(f"{split} corpus must be a list")'
          if text.count(old) != 1:
              raise RuntimeError(f"expected one exact lint marker, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff check --fix \
            tools/research/step4_phase45d_task_specific_guard_cases.py \
            tools/research/step4_phase45d_task_specific_guard_bakeoff.py \
            tests/test_phase45d_task_specific_guard_bakeoff.py
          ruff format \
            tools/research/step4_phase45d_task_specific_guard_cases.py \
            tools/research/step4_phase45d_task_specific_guard_bakeoff.py \
            tests/test_phase45d_task_specific_guard_bakeoff.py
          ruff check \
            tools/research/step4_phase45d_task_specific_guard_cases.py \
            tools/research/step4_phase45d_task_specific_guard_bakeoff.py \
            tests/test_phase45d_task_specific_guard_bakeoff.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/research/step4_phase45d_task_specific_guard_cases.py \
            tools/research/step4_phase45d_task_specific_guard_bakeoff.py \
            tests/test_phase45d_task_specific_guard_bakeoff.py
          git commit -m "Format task-specific memory guard bake-off"
          git push origin HEAD:implementation/step-4-memory-context
