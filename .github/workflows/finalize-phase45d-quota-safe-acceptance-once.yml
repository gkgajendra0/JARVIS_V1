name: Finalize Phase 4.5D quota-safe acceptance error boundary once

on: [push]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize quota-safe acceptance error boundary once'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tighten provider-only pause boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/research/step4_phase45d_final_composite_acceptance.py')
          text = path.read_text(encoding='utf-8')

          old = '''class ProviderCallBudgetExceeded(RuntimeError):
              """Raised before a provider call would exceed the certified invocation budget."""


          class PacedMemoryQueryInterpreter:
          '''.replace('          ', '')
          new = '''class ProviderCallBudgetExceeded(RuntimeError):
              """Raised before a provider call would exceed the certified invocation budget."""


          class ProviderExecutionPaused(RuntimeError):
              """Raised only when the provider adapter fails after a certified API attempt."""


          class PacedMemoryQueryInterpreter:
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('provider exception insertion marker changed')
          text = text.replace(old, new, 1)

          old = '''        self.logical_calls += 1
                  self.api_attempts += 1
                  proposal = await self._delegate.interpret(text=text, catalog=catalog)
                  self.last_proposal = proposal
                  self.last_attempts = 1
                  return proposal
          '''.replace('          ', '')
          new = '''        self.logical_calls += 1
                  self.api_attempts += 1
                  self.last_attempts = 1
                  try:
                      proposal = await self._delegate.interpret(text=text, catalog=catalog)
                  except Exception as exc:
                      raise ProviderExecutionPaused(
                          f"provider adapter failed: {type(exc).__name__}"
                      ) from exc
                  self.last_proposal = proposal
                  return proposal
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('provider call marker changed')
          text = text.replace(old, new, 1)

          old = '''    try:
                  result = asyncio.run(
                      _run(
                          device=str(args.device),
                          gemini_rpm=float(args.gemini_rpm),
                          provider_budget=int(quota_plan["required_provider_calls"]),
                          checkpoint_path=checkpoint_path,
                          repository_sha=repository_sha,
                          checkpoint_results=checkpoint_results,
                          quota_budget=budget,
                      )
                  )
              except Exception as exc:
                  print("STATUS: EXECUTION_PAUSED_PROVIDER")
                  print(
                      "RESUME:",
                      json.dumps(
                          {
                              "checkpoint": str(checkpoint_path),
                              "repository_sha": repository_sha,
                              "error_type": type(exc).__name__,
                          },
                          ensure_ascii=False,
                      ),
                  )
                  raise
          '''.replace('          ', '')
          new = '''    try:
                  result = asyncio.run(
                      _run(
                          device=str(args.device),
                          gemini_rpm=float(args.gemini_rpm),
                          provider_budget=int(quota_plan["required_provider_calls"]),
                          checkpoint_path=checkpoint_path,
                          repository_sha=repository_sha,
                          checkpoint_results=checkpoint_results,
                          quota_budget=budget,
                      )
                  )
              except ProviderExecutionPaused as exc:
                  print("STATUS: EXECUTION_PAUSED_PROVIDER")
                  print(
                      "RESUME:",
                      json.dumps(
                          {
                              "checkpoint": str(checkpoint_path),
                              "repository_sha": repository_sha,
                              "error_type": type(exc.__cause__).__name__ if exc.__cause__ else type(exc).__name__,
                          },
                          ensure_ascii=False,
                      ),
                  )
                  raise
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('main exception marker changed')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add provider-only pause tests
        shell: bash
        run: |
          cat >> tests/test_phase45d_final_composite_acceptance.py <<'PY'


          def test_provider_failure_is_wrapped_as_provider_pause() -> None:
              import asyncio

              delegate = _OneShotDelegate()
              interpreter = harness.PacedMemoryQueryInterpreter(delegate, rpm=60, max_calls=1)
              catalog = harness.MemoryFacetCatalog(facets=())
              try:
                  asyncio.run(interpreter.interpret(text="test", catalog=catalog))
              except harness.ProviderExecutionPaused as exc:
                  assert isinstance(exc.__cause__, RuntimeError)
              else:
                  raise AssertionError("provider failure must be wrapped as a provider pause")
              assert delegate.calls == 1
              assert interpreter.api_attempts == 1
              assert interpreter.last_attempts == 1
          PY
      - name: Format and lint scoped files
        shell: bash
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
          ruff check --fix tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
      - name: Commit finalized harness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
          git commit -m "Finalize quota-safe acceptance provider pause boundary"
          git push origin HEAD:implementation/step-4-memory-context
