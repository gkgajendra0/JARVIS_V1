name: Hybrid HUD Screenshots

on:
  pull_request:
    paths:
      - "frontend/jarvis-hud/**"
      - "src/jarvis/ui/**"
      - "scripts/hud_visual_smoke.py"
      - ".github/workflows/hybrid-hud-preview.yml"
  workflow_dispatch:

jobs:
  ui-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/jarvis-hud/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build hybrid UI
        working-directory: frontend/jarvis-hud
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up local browser smoke
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Test local read-only boundary
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_hybrid_ui.py -q

      - name: Capture ultrawide, desktop and mobile views
        env:
          PYTHONPATH: src
        run: python scripts/hud_visual_smoke.py --output artifacts/ui-hud

      - name: Upload owner-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-hybrid-ui-review
          path: artifacts/ui-hud/*.png
          if-no-files-found: warn
