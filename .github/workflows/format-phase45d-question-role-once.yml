name: Format Phase45D Question Role Once

on:
  push:
    branches:
      - implementation/step-4-memory-context

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format and validate
        shell: bash
        run: |
          python -m pip install 'ruff==0.16.5' 'pytest>=8,<10'
          ruff format tools/research/step4_phase45d_question_role_bakeoff.py tests/test_phase45d_question_role_bakeoff.py
          ruff check tools/research/step4_phase45d_question_role_cases.py tools/research/step4_phase45d_question_role_bakeoff.py tests/test_phase45d_question_role_bakeoff.py
          pytest -q tests/test_phase45d_question_role_bakeoff.py
      - name: Commit formatter-only changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatter changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/research/step4_phase45d_question_role_bakeoff.py tests/test_phase45d_question_role_bakeoff.py
          git commit -m 'Format Phase 4.5D question-role research files'
          git push origin HEAD:implementation/step-4-memory-context
