name: Sync Phase45D Answerability Once

on:
  push:
    branches:
      - implementation/step-4-memory-context

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.5'
      - name: Format answerability research files
        run: |
          ruff format tools/research/step4_phase45d_answerability_cases.py tools/research/step4_phase45d_answerability_bakeoff.py tests/test_phase45d_answerability_bakeoff.py
          ruff check --fix tools/research/step4_phase45d_answerability_cases.py tools/research/step4_phase45d_answerability_bakeoff.py tests/test_phase45d_answerability_bakeoff.py
      - name: Synchronize Current Plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/CURRENT_PLAN.md')
          text = path.read_text(encoding='utf-8')

          old_stage = '**STEP 3 COMPLETE + MERGED — STEP 4 PHASES 4.0A–4.5C COMPLETE — PHASE 4.5D ACTIVE — V4 FAILED / RETIRED — TASK-SPECIFIC LOCAL GUARD BAKE-OFF METHOD V2 FROZEN — PHASE 4.5E BLOCKED**'
          new_stage = '**STEP 3 COMPLETE + MERGED — STEP 4 PHASES 4.0A–4.5C COMPLETE — PHASE 4.5D ACTIVE — V4 + METHOD V2 FAILED / RETIRED — ANSWERABILITY COMPONENT BAKE-OFF V1 FROZEN — PHASE 4.5E BLOCKED**'
          if old_stage not in text:
              raise RuntimeError('expected CURRENT_PLAN stage line not found')
          text = text.replace(old_stage, new_stage, 1)

          text = text.replace(
              '## Active 4.5D direction — JARVIS-SIDE TASK-SPECIFIC LOCAL GUARD REPLACEMENT',
              '## Active 4.5D direction — ANSWERABILITY / EVIDENCE SUFFICIENCY',
              1,
          )

          replacement = '''### Task-specific local guard bake-off — METHOD V2 FAILED / RETIRED

Owner-run repository SHA:

`d9dc8cc06edd81288c6af370c0032a7f771e8b23`

Durable result:

- `docs/research/STEP_4_PHASE_4_5D_TASK_SPECIFIC_GUARD_BAKEOFF_V2_RESULT.md`.

All four frozen-embedding + LogisticRegression candidates failed the safety boundary:

- multilingual MiniLM: `9` false allows, overall allow recall `0.791667`, comparison `0.625000`, macro-F1 `0.646962`;
- multilingual E5-small: `11` false allows, overall `0.854167`, comparison `0.708333`, macro-F1 `0.726627`;
- multilingual MPNet-base-v2: `12` false allows, overall `0.854167`, comparison `0.750000`, macro-F1 `0.809516`;
- Qwen3-Embedding-0.6B 256d: `14` false allows, overall `0.791667`, comparison `0.625000`, macro-F1 `0.623784`.

No candidate passed. Method V2 is exposed and permanently retired. Do not rerun it, threshold-tune it, train on its holdout, or treat its relative winner as selectable.

### Custom eight-class encoder fine-tune V3 — SUPERSEDED BEFORE EXECUTION

A direct mmBERT/XLM-R eight-class fine-tune method was prepared after Method V2 but **never owner-run**. A deeper research pass showed that it still framed the boundary as query-only intent classification rather than evidence sufficiency.

The V3 executable corpus/harness/tests and fine-tuning dependency group were removed before any model was trained or holdout was scored. Historical rationale remains in:

- `docs/research/STEP_4_PHASE_4_5D_TASK_GUARD_FINETUNE_V3_METHOD.md`.

There is no V3 result evidence and no exposed V3 owner holdout.

### Answerability component bake-off V1 — FROZEN / ZERO-TRAINING / NEXT

Research now uses mature native tasks instead of another custom classifier:

1. **extractive QA with no-answer** for open current-value questions: question + canonical fact -> exact value span or NULL;
2. **native multilingual NLI** for comparisons: canonical fact + structured proposition -> entailment / contradiction / neutral, corresponding to YES / NO / IDK.

This is component model selection only. It makes zero Gemini/OpenAI calls and performs zero task-specific training.

Frozen fresh corpus:

- `288` QA cases: `96` answerable + `192` no-answer;
- `96` native NLI cases;
- English / Hindi / Hinglish;
- 8 new facts;
- deterministic payload SHA-256 `3e2bd6830df3d08b3ea4ce8e045ee78cf562c228c5b0d2e5e094ffa42b6b44a3`;
- zero exact normalized question overlap with retired V4 and exposed Method V2.

QA candidates:

- `deepset/xlm-roberta-base-squad2` @ `a5fab9908c8d856e8c583fd41ba6d92444e46477`;
- `timpal0l/mdeberta-v3-base-squad2` @ `08d6e89c7a6557f967db2e1021f7f640483400ed`.

Both use the Hugging Face question-answering pipeline with native impossible-answer handling, `top_k=1`, max answer length `16`, Safetensors, `trust_remote_code=False`, FP32 and **no fitted threshold**.

Native NLI candidate:

- existing pinned `MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7` @ `b5113eb38ab63efdd7f280f8c144ea8b13f978ce`;
- native labels entailment / neutral / contradiction;
- argmax only, no probability threshold.

Frozen QA safety gates require zero unauthorized non-empty releases, zero wrong-evidence spans, overall answerable recall >= `0.90`, and each language >= `0.85`.

Frozen NLI gates require zero releases on neutral/unknown cases, zero wrong boolean verdicts, comparison recall >= `0.90`, and each language >= `0.85`.

Method:

- `docs/research/STEP_4_PHASE_4_5D_ANSWERABILITY_BAKEOFF_METHOD.md`.

Harness:

- `tools/research/step4_phase45d_answerability_cases.py`;
- `tools/research/step4_phase45d_answerability_bakeoff.py`.

A composite development pass requires at least one QA reader to pass plus the native NLI lane to pass. Even then production remains unchanged: the next work would be to freeze the component contracts and extend JARVIS's provider-independent query proposal/policy so boolean proposition + polarity can be represented without giving the provider release authority.

## Phase 4.5E — BLOCKED'''
          pattern = re.compile(
              r'### Task-specific local guard bake-off — METHOD V2 FROZEN / DEVELOPMENT-ONLY\n.*?\n## Phase 4\.5E — BLOCKED',
              re.S,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'expected one Method V2 section replacement, got {count}')

          old_order = '**4.5D — ACTIVE: V4 completed and failed/retired; generic zero-shot NLI guard isolated as the blocker; corrected zero-cloud task-specific local guard bake-off Method V2 frozen and next.**'
          new_order = '**4.5D — ACTIVE: V4 and Method V2 failed/retired; custom eight-class fine-tune V3 superseded before execution; frozen zero-training answerability component bake-off V1 is next.**'
          if old_order not in text:
              raise RuntimeError('expected remaining-order line not found')
          text = text.replace(old_order, new_order, 1)

          tail = '''## Do not repeat / do not do next

Do not:

- rerun V4 provider-backed or provider-independent acceptance;
- train, threshold-tune, or score replacement models on V4 query text/results;
- rerun Method V2 or modify its exposed holdout/gates and call it fresh evidence;
- run the removed custom eight-class fine-tune V3; it was superseded before execution;
- change the frozen answerability V1 corpus, gates, candidate revisions, native task mapping, or no-threshold policy after seeing owner results and still call the rerun V1;
- use QA/NLI confidence scores to rescue a failed V1 through post-hoc threshold fitting;
- treat a V1 component pass as production authorization or final acceptance;
- modify the current production answer-type guard until a replacement architecture is fully implemented and passes fresh final acceptance;
- reuse V2/V4 evidence as fresh acceptance;
- treat the retrieval-depth diagnostic as acceptance;
- test 512d/1024d embeddings now;
- swap accepted Qwen embedding/reranker merely to fix answerability;
- start 4.5E or wire semantic retrieval into Gemini conversation;
- rerun Qwen vs EmbeddingGemma selection;
- rerun 4.5C owner compatibility unless contracts change;
- change Qwen revisions or Torch/Torchvision casually;
- disturb accepted Step-3 audio/vision architecture;
- weaken historical/forgotten/local-only/secret/untrusted eligibility filters;
- let learned confidence create, modify, resurrect or establish canonical truth.

---

## Immediate Next Action

**RUN THE FROZEN ZERO-CLOUD ANSWERABILITY COMPONENT BAKE-OFF V1 ON THE OWNER RTX MACHINE — ONLY AFTER AN EXACT GREEN REPOSITORY SHA IS SUPPLIED.**

Before owner execution:

- verify the exact branch SHA matches the supplied green SHA;
- verify `.step4-phase45d-answerability-bakeoff-v1.json` is absent;
- verify corpus SHA-256 `3e2bd6830df3d08b3ea4ce8e045ee78cf562c228c5b0d2e5e094ffa42b6b44a3`;
- install/use `.[phase45d-answerability]`;
- preserve owner Torch `2.13.0+cu132`, Torchvision `0.28.0+cu132`, Transformers `5.16.1`;
- verify SentencePiece `0.2.2` and psutil `7.2.2`;
- run no cloud/provider diagnostics in parallel.

If no QA candidate passes or native NLI fails, retire the exposed V1 corpus and research that failure class without tuning thresholds on V1. If the composite passes, freeze the selected component contracts and continue with structured proposition/polarity integration; do **not** create final acceptance until that full development architecture is implemented and frozen.

Phase 4.5E remains blocked until a completely fresh final acceptance passes and 4.5D has durable closure evidence on a green exact SHA.
'''
          pattern = re.compile(
              r'## Do not repeat / do not do next\n.*?\n---\n\n## Immediate Next Action\n.*\Z',
              re.S,
          )
          text, count = pattern.subn(tail, text, count=1)
          if count != 1:
              raise RuntimeError(f'expected one tail replacement, got {count}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit synchronized answerability method
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_PLAN.md tools/research/step4_phase45d_answerability_cases.py tools/research/step4_phase45d_answerability_bakeoff.py tests/test_phase45d_answerability_bakeoff.py
          git commit -m 'Format and sync Phase 4.5D answerability V1'
          git push origin HEAD:implementation/step-4-memory-context
