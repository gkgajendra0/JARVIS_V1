name: Format Phase 4.5D Semantic Judge Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/format-phase45d-semantic-judge-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.16.5"

      - name: Apply scoped Ruff formatting and safe fixes
        run: |
          ruff format \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py
          ruff check --fix \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py
          ruff format \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py

      - name: Synchronize current Phase 4.5D plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/CURRENT_PLAN.md")
          text = path.read_text(encoding="utf-8")

          old_stage = "**STEP 3 COMPLETE + MERGED — STEP 4 PHASES 4.0A–4.5C COMPLETE — PHASE 4.5D ACTIVE — V1/V2 RELEASE-CONFIDENCE ARCHITECTURES REJECTED — TOP-10 QWEN RETRIEVAL DEVELOPMENT RESULT PASSED — TASK-MATCHED ANSWERABILITY VERIFIER BAKE-OFF NEXT — PHASE 4.5E BLOCKED**"
          new_stage = "**STEP 3 COMPLETE + MERGED — STEP 4 PHASES 4.0A–4.5C COMPLETE — PHASE 4.5D ACTIVE — V1/V2 CONFIDENCE + QA VERIFIER ARCHITECTURES REJECTED — TOP-10 QWEN RETRIEVAL DEVELOPMENT RESULT PASSED — GLiCLASS VS GEMINI SEMANTIC-JUDGE BAKE-OFF NEXT — PHASE 4.5E BLOCKED**"
          if old_stage not in text:
              raise SystemExit("expected CURRENT_PLAN stage marker not found")
          text = text.replace(old_stage, new_stage, 1)

          section_start = "## Active 4.5D development direction — ANSWERABILITY VERIFIER"
          section_end = "## Fresh V3 boundary — NOT YET AUTHORIZED"
          start = text.index(section_start)
          end = text.index(section_end)
          replacement = '''## Post-V2 answerability-verifier diagnosis — REJECTED / DEVELOPMENT-ONLY

Owner-run exact SHA:

`31abd55ab6db078098cddc5a23e6ef1244540180`

Durable result:

- `docs/research/STEP_4_PHASE_4_5D_ANSWERABILITY_VERIFIER_RESULT.md`.

The task-matched multilingual QA verifier was:

`deepset/xlm-roberta-base-squad2-distilled`

Revision:

`c1bbfe57bc3335c37960a48c5628ba26d7e9e3b7`

The top-10 Qwen path again ranked every positive correctly:

- overall Top-1 `900/900 = 1.000000`;
- calibration Top-1 `600/600 = 1.000000`;
- validation Top-1 `300/300 = 1.000000`.

Calibration selected QA margin threshold `7.436666965484619` at:

- `577 TP / 30 FP`;
- precision `0.950577`;
- positive release recall `0.961667`.

Applied unchanged to the differently worded validation set, the same threshold produced:

- `140 TP / 12 FP`;
- precision `0.921053`;
- positive release recall `0.466667`;
- failed per-language release-recall gate;
- two security-boundary false releases.

The 12 validation false releases were:

- 9 relation mismatch;
- 1 ambiguous;
- 2 historical, both Hindi (`v2_val_a0191`, `v2_val_a0194`).

### QA decision

Reject the SQuAD2 answerability verifier for V3 freeze.

The model detected answer-like spans but did not robustly enforce the exact relation and temporal scope required by JARVIS. The calibration-to-validation precision drop also confirms template/paraphrase sensitivity.

Do not tune this QA threshold against V2 validation and do not create V3 from this architecture.

---

## Active 4.5D development direction — SEMANTIC JUDGE BAKE-OFF

V2 is fully exposed and may now be used only for development architecture selection. **Do not create V3 yet.**

Durable method:

- `docs/research/STEP_4_PHASE_4_5D_SEMANTIC_JUDGE_BAKEOFF_METHOD.md`.

The retrieval side is frozen for this experiment:

```text
canonical eligibility
 -> FTS5 lexical + Qwen dense 256d
 -> equal-weight RRF
 -> top 10
 -> Qwen3-Reranker-0.6B + frozen JARVIS instruction
 -> selected Top-1 memory
```

Research selected two task-matched semantic challengers rather than another generic relevance scorer:

### Local challenger — GLiClass Multilang Mini

`knowledgator/gliclass-multilang-mini`

Pinned development revision:

`c09fb5ca4cb7957044168e6bf8bcefa2e14b8dfb`

Pinned research package:

`gliclass==0.1.20`

Rationale:

- approximately 288M parameters;
- Apache-2.0;
- multilingual training includes Hindi;
- explicitly supports hallucination detection, NLI and rule-following verification;
- compatible with the accepted Torch / Transformers family;
- no production dependency is introduced; it is a separate Phase-4.5D research extra.

The fixed local signal is `release_score - abstain_score`. Any scalar threshold is selected using exposed V2 calibration only and then applied unchanged to V2 validation.

### Cloud challenger — Gemini 3.5 Flash-Lite

`gemini-3.5-flash-lite`

Rationale:

- already the accepted JARVIS cloud-provider family;
- structured JSON output path already exists in the repository;
- suited to low-cost classification/subagent work;
- no second provider/account is introduced.

The judge receives only query + selected memory document. Ground-truth label, category, split, expected memory ID and case semantics are never supplied.

The Gemini instruction explicitly requires abstention for relation mismatch, historical/current temporal mismatch, ambiguity, contradiction/negation, missing requested detail, unsupported inference and merely topical relevance.

### Conservative conjunction

Also measure at no extra model-call cost:

```text
Gemini decision == release
AND
GLiClass margin >= calibration-selected threshold
```

### Development gates

A candidate may be called promising for V3 design only if all exposed-V2 development checks hold:

1. validation precision >= `0.95`;
2. validation positive release recall >= `0.40`;
3. EN recall >= `0.25`;
4. HI recall >= `0.25`;
5. Hinglish recall >= `0.25`;
6. zero historical / forgotten / local-only / secret / untrusted releases.

These are development-selection gates only, not final statistical acceptance.

If none of GLiClass, Gemini, or their conjunction clears the gates, preserve the evidence and research the next mature semantic-verification approach. Do not lower the floors and do not generate V3 merely to obtain another failure.

---

'''
          text = text[:start] + replacement + text[end:]

          old_order = "9. **4.5D — ACTIVE: top-10 retrieval diagnosis complete; task-matched multilingual answerability verifier development bake-off next.**"
          new_order = "9. **4.5D — ACTIVE: top-10 retrieval diagnosis complete; QA verifier rejected; GLiClass-vs-Gemini semantic-judge development bake-off next.**"
          if old_order not in text:
              raise SystemExit("expected CURRENT_PLAN implementation-order marker not found")
          text = text.replace(old_order, new_order, 1)

          old_bge = "- jump directly to BGE without first evaluating the selected task-matched answerability verifier;"
          new_bge = "- jump to another generic relevance scorer while the task-matched GLiClass-vs-Gemini semantic-judge bake-off is unresolved;"
          if old_bge not in text:
              raise SystemExit("expected CURRENT_PLAN generic-reranker marker not found")
          text = text.replace(old_bge, new_bge, 1)

          immediate = text.index("## Immediate Next Action")
          text = text[:immediate] + '''## Immediate Next Action

**PASS THE GLiCLASS-VS-GEMINI SEMANTIC-JUDGE DEVELOPMENT HARNESS THROUGH CI ON A CLEAN EXACT SHA, THEN RUN THE EXPOSED-V2 DEVELOPMENT BAKE-OFF ONCE.**

Do not generate fresh V3 acceptance data until this semantic-verifier architecture question is resolved. Phase 4.5E remains blocked.
'''

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit scoped changes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No scoped changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py \
            docs/CURRENT_PLAN.md
          git commit -m "Sync Phase 4.5D semantic judge bakeoff"
          git push origin HEAD:implementation/step-4-memory-context
