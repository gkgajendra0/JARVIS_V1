name: Format Phase 4.5D Semantic Judge Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/format-phase45d-semantic-judge-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.16.5"

      - name: Apply scoped Ruff formatting and safe fixes
        run: |
          ruff format \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py
          ruff check --fix \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py
          ruff format \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py

      - name: Commit scoped Ruff changes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/research/step4_phase45d_semantic_judge_bakeoff.py \
            tests/test_phase45d_semantic_judge_bakeoff.py
          git commit -m "Format Phase 4.5D semantic judge bakeoff"
          git push origin HEAD:implementation/step-4-memory-context
