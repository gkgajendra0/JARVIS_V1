name: Hands Format Fix

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[hands-format]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format integrated Hands files
        run: |
          python -m pip install ruff==0.16.5
          python - <<'PY'
          from pathlib import Path

          runtime = Path("src/jarvis/capabilities/runtime.py")
          text = runtime.read_text(encoding="utf-8")
          text = text.replace(
              "except Exception:  # noqa: BLE001 - shutdown must continue across adapters",
              "except Exception:  # noqa: BLE001,S110 - shutdown must continue across adapters",
              1,
          )
          runtime.write_text(text, encoding="utf-8")

          goal = Path("src/jarvis/voice/hands_goal_tools.py")
          text = goal.read_text(encoding="utf-8").replace("re.I)", "re.IGNORECASE)", 1)
          goal.write_text(text, encoding="utf-8")
          PY
          ruff format src/jarvis/capabilities/runtime.py src/jarvis/hands/registry.py src/jarvis/voice/hands_goal_tools.py tests/test_hands_goal_tools.py
          ruff check src/jarvis/capabilities/runtime.py src/jarvis/hands/registry.py src/jarvis/voice/hands_goal_tools.py tests/test_hands_goal_tools.py
      - name: Commit only formatted source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/capabilities/runtime.py src/jarvis/hands/registry.py src/jarvis/voice/hands_goal_tools.py tests/test_hands_goal_tools.py
          git diff --cached --quiet && exit 0
          git commit -m "Format integrated Hands changes [hands-format]"
          git push origin HEAD:feat/governed-jarvis-hands-v1
