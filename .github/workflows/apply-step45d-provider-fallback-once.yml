name: Apply Step45D Provider Fallback Once

on:
  push:
    branches:
      - implementation/step-4-provider-memory-release
    paths:
      - .github/workflows/apply-step45d-provider-fallback-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-provider-memory-release
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply bounded provider fallback patch
        run: python tools/research/_apply_step45d_provider_fallback_patch.py

      - name: Format and lint changed Python
        run: |
          ruff format src/jarvis/config.py src/jarvis/machine_config.py src/jarvis/memory/runtime.py src/jarvis/memory/release_guard.py src/jarvis/memory/provider_verified_query.py src/jarvis/voice/memory_tools.py src/jarvis/voice/canonical_active_speaker_runtime.py src/jarvis/voice/production_runtime.py src/jarvis/voice/agent.py tests/test_memory_provider_release_guard.py tests/test_memory_provider_verified_query.py tests/test_memory_semantic_recall_config.py
          ruff check --fix src/jarvis/config.py src/jarvis/machine_config.py src/jarvis/memory/runtime.py src/jarvis/memory/release_guard.py src/jarvis/memory/provider_verified_query.py src/jarvis/voice/memory_tools.py src/jarvis/voice/canonical_active_speaker_runtime.py src/jarvis/voice/production_runtime.py src/jarvis/voice/agent.py tests/test_memory_provider_release_guard.py tests/test_memory_provider_verified_query.py tests/test_memory_semantic_recall_config.py

      - name: Run focused tests
        run: python -m pytest -q tests/test_memory_provider_release_guard.py tests/test_memory_provider_verified_query.py tests/test_memory_semantic_recall_config.py tests/test_memory_tools.py tests/test_config.py tests/test_machine_config.py tests/test_voice_runtime.py

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-step45d-provider-fallback-once.yml

      - name: Commit clean implementation
        run: |
          git config user.name "Gajendra Kumar"
          git config user.email "132376559+gkgajendra0@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement bounded provider-assisted semantic memory recall"
          git push origin HEAD:implementation/step-4-provider-memory-release
