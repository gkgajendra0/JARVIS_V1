name: Apply Step45D Provider Fallback Once

on:
  push:
    branches:
      - implementation/step-4-provider-memory-release
    paths:
      - .github/workflows/apply-step45d-provider-fallback-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-provider-memory-release
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Correct one-shot plan anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/research/_apply_step45d_provider_fallback_patch.py")
          text = path.read_text(encoding="utf-8")
          old = '''replace_once(
              "docs/CURRENT_PLAN.md",
              "## Step-5 boundary\\n",
              "## Reopened bounded 4.5D fallback\\n\\nThe owner authorized a pragmatic provider-assisted recall path on 2026-09-08. The strict independent semantic guard remains unresolved; this does not rewrite the failed research evidence. The bounded fallback uses the active `JARVIS_AI_PROVIDER` for both structured query interpretation and a second structured semantic `ALLOW/ABSTAIN` verification around JARVIS-owned exact canonical lookup. It is opt-in through `JARVIS_MEMORY_SEMANTIC_RECALL_MODEL`, fail-closed on all provider/validation errors, and never releases `local_only` or secret-prohibited memory to the cloud provider. See `docs/research/STEP_4_PHASE_4_5D_PROVIDER_ASSISTED_FALLBACK.md`.\\n\\nStep 5 remains explicitly not started until this fallback is integrated and the owner separately authorizes Step 5.\\n\\n---\\n\\n## Step-5 boundary\\n",
          )'''
          new = '''replace_once(
              "docs/CURRENT_PLAN.md",
              "## Immediate Next Action\\n",
              "## Reopened bounded 4.5D fallback\\n\\nThe owner authorized a pragmatic provider-assisted recall path on 2026-09-08. The strict independent semantic guard remains unresolved; this does not rewrite the failed research evidence. The bounded fallback uses the active `JARVIS_AI_PROVIDER` for both structured query interpretation and a second structured semantic `ALLOW/ABSTAIN` verification around JARVIS-owned exact canonical lookup. It is opt-in through `JARVIS_MEMORY_SEMANTIC_RECALL_MODEL`, fail-closed on all provider/validation errors, and never releases `local_only` or secret-prohibited memory to the cloud provider. See `docs/research/STEP_4_PHASE_4_5D_PROVIDER_ASSISTED_FALLBACK.md`.\\n\\nStep 5 remains explicitly not started until this fallback is integrated and the owner separately authorizes Step 5.\\n\\n---\\n\\n## Immediate Next Action\\n",
          )'''
          if old not in text:
              raise SystemExit("expected stale CURRENT_PLAN patch block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply bounded provider fallback patch
        run: python tools/research/_apply_step45d_provider_fallback_patch.py

      - name: Format and lint changed Python
        run: |
          ruff format src/jarvis/config.py src/jarvis/machine_config.py src/jarvis/memory/runtime.py src/jarvis/memory/release_guard.py src/jarvis/memory/provider_verified_query.py src/jarvis/voice/memory_tools.py src/jarvis/voice/canonical_active_speaker_runtime.py src/jarvis/voice/production_runtime.py src/jarvis/voice/agent.py tests/test_memory_provider_release_guard.py tests/test_memory_provider_verified_query.py tests/test_memory_semantic_recall_config.py
          ruff check --fix src/jarvis/config.py src/jarvis/machine_config.py src/jarvis/memory/runtime.py src/jarvis/memory/release_guard.py src/jarvis/memory/provider_verified_query.py src/jarvis/voice/memory_tools.py src/jarvis/voice/canonical_active_speaker_runtime.py src/jarvis/voice/production_runtime.py src/jarvis/voice/agent.py tests/test_memory_provider_release_guard.py tests/test_memory_provider_verified_query.py tests/test_memory_semantic_recall_config.py

      - name: Run focused tests
        run: python -m pytest -q tests/test_memory_provider_release_guard.py tests/test_memory_provider_verified_query.py tests/test_memory_semantic_recall_config.py tests/test_memory_tools.py tests/test_config.py tests/test_machine_config.py tests/test_voice_runtime.py

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-step45d-provider-fallback-once.yml

      - name: Commit clean implementation
        run: |
          git config user.name "Gajendra Kumar"
          git config user.email "132376559+gkgajendra0@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement bounded provider-assisted semantic memory recall"
          git push origin HEAD:implementation/step-4-provider-memory-release
