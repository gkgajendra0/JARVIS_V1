name: Finalize Phase 4.5D Coverage Diagnostic Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/phase45d-coverage-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0

      - name: Format and lint coverage diagnostic
        shell: bash
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format tools/research/step4_phase45d_gemini_single_instance_coverage_diagnostic.py tests/test_phase45d_gemini_single_instance_coverage_diagnostic.py
          ruff check --fix tools/research/step4_phase45d_gemini_single_instance_coverage_diagnostic.py tests/test_phase45d_gemini_single_instance_coverage_diagnostic.py
          ruff format tools/research/step4_phase45d_gemini_single_instance_coverage_diagnostic.py tests/test_phase45d_gemini_single_instance_coverage_diagnostic.py
          ruff check tools/research/step4_phase45d_gemini_single_instance_coverage_diagnostic.py tests/test_phase45d_gemini_single_instance_coverage_diagnostic.py

      - name: Synchronize current Phase 4.5D plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          path = Path("docs/CURRENT_PLAN.md")
          text = path.read_text(encoding="utf-8")

          old_stage = "**STEP 3 COMPLETE + MERGED — STEP 4 PHASES 4.0A–4.5C COMPLETE — PHASE 4.5D ACTIVE — TOP-10 QWEN DEVELOPMENT RETRIEVAL PASSED — QA + GLICLASS REJECTED — GEMINI BATCH-120 RESULT HAS A PRODUCTION-SHAPE CONFOUND — SINGLE-INSTANCE BOUNDARY DIAGNOSTIC NEXT — PHASE 4.5E BLOCKED**"
          new_stage = "**STEP 3 COMPLETE + MERGED — STEP 4 PHASES 4.0A–4.5C COMPLETE — PHASE 4.5D ACTIVE — TOP-10 QWEN DEVELOPMENT RETRIEVAL PASSED — QA + GLICLASS REJECTED — GEMINI SINGLE-INSTANCE BOUNDARY 15/15 PASSED — 24-CASE PRODUCTION-SHAPE COVERAGE DIAGNOSTIC NEXT — PHASE 4.5E BLOCKED**"
          assert old_stage in text
          text = text.replace(old_stage, new_stage, 1)

          section_b64 = ""
          section = base64.b64decode(section_b64).decode("utf-8")
          pattern = re.compile(
              r"## Active 4\.5D development direction — GEMINI SINGLE-INSTANCE BOUNDARY DIAGNOSTIC\n.*?\n---\n\n## Fresh V3 boundary",
              re.S,
          )
          text, count = pattern.subn(section, text, count=1)
          assert count == 1

          old_order = "9. **4.5D — ACTIVE: top-10 retrieval complete; QA/GLiClass rejected; Gemini single-instance boundary diagnostic next.**"
          new_order = "9. **4.5D — ACTIVE: top-10 retrieval complete; boundary single-instance 15/15 passed; 24-case coverage diagnostic next.**"
          assert old_order in text
          text = text.replace(old_order, new_order, 1)

          old_nli = "- jump to BGE or multilingual NLI before resolving the frozen Gemini single-instance production-shape diagnostic;"
          new_nli = "- jump to BGE or multilingual NLI before resolving the frozen 24-case Gemini single-instance coverage diagnostic;"
          assert old_nli in text
          text = text.replace(old_nli, new_nli, 1)

          immediate_b64 = ""
          immediate = base64.b64decode(immediate_b64).decode("utf-8")
          immediate_pattern = re.compile(r"## Immediate Next Action\n.*\Z", re.S)
          text, count = immediate_pattern.subn(immediate, text, count=1)
          assert count == 1

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit finalized coverage diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_PLAN.md tools/research/step4_phase45d_gemini_single_instance_coverage_diagnostic.py tests/test_phase45d_gemini_single_instance_coverage_diagnostic.py
          git commit -m "Finalize Phase 4.5D single-instance coverage diagnostic"
          git push origin HEAD:implementation/step-4-memory-context
