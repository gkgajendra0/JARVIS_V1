name: Fix final composite imports once

on: [push]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run scoped final composite import fix once'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.5"
      - run: ruff check --fix tools/research/step4_phase45d_final_composite_acceptance.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/step4_phase45d_final_composite_acceptance.py
          git commit -m "Fix final composite acceptance imports"
          git push origin HEAD:implementation/step-4-memory-context
