name: Pocket 3 Wi-Fi Hotfix Applicator

on:
  push:
    branches:
      - fix/runtime-stability-pass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-stability-pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Pocket 3 Wi-Fi sequencing hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          native_path = Path("src/jarvis/vision/pocket3_native.py")
          native = native_path.read_text(encoding="utf-8")

          old = '''    connect_timeout_seconds: float = 25.0
              wifi_join_timeout_seconds: float = 15.0
              command_timeout_seconds: float = 1.5
          '''.replace("              ", "    ")
          new = '''    connect_timeout_seconds: float = 25.0
              wifi_ap_settle_seconds: float = 2.0
              wifi_join_timeout_seconds: float = 15.0
              command_timeout_seconds: float = 1.5
          '''.replace("              ", "    ")
          assert native.count(old) == 1, "Pocket3NativeConfig block drifted"
          native = native.replace(old, new, 1)

          old = '''            "connect_timeout_seconds",
              "wifi_join_timeout_seconds",
          '''.replace("              ", "            ")
          new = '''            "connect_timeout_seconds",
              "wifi_ap_settle_seconds",
              "wifi_join_timeout_seconds",
          '''.replace("              ", "            ")
          assert native.count(old) == 1, "Pocket3NativeConfig validation block drifted"
          native = native.replace(old, new, 1)

          old = '''            self._credentials_ready.set()

              keepalive = _build_duml(
          '''.replace("              ", "            ")
          new = '''            # FFF5 is write-without-response. The hardware-proven Pocket 3
              # sequence leaves a bounded settle window after 53/10 wakes the Wi-Fi AP
              # before Windows association and before the next BLE keepalive write.
              await asyncio.sleep(self.config.wifi_ap_settle_seconds)
              LOGGER.info(
                  "Pocket 3 Wi-Fi AP wake settle complete; releasing Windows association"
              )
              self._credentials_ready.set()

              keepalive = _build_duml(
          '''.replace("              ", "            ")
          assert native.count(old) == 1, "Pocket 3 AP wake handoff block drifted"
          native = native.replace(old, new, 1)
          native_path.write_text(native, encoding="utf-8")

          recovery_path = Path("src/jarvis/vision/pocket3_recovery.py")
          recovery = recovery_path.read_text(encoding="utf-8")
          old = '''                LOGGER.warning(
                      "Pocket 3 Wi-Fi association attempt %d/%d failed; retrying",
                      attempt,
                      self.recovery_config.wifi_join_attempts,
                  )
          '''.replace("                  ", "                ")
          new = '''                LOGGER.warning(
                      "Pocket 3 Wi-Fi association attempt %d/%d failed (%s: %s); retrying",
                      attempt,
                      self.recovery_config.wifi_join_attempts,
                      type(exc).__name__,
                      exc,
                  )
          '''.replace("                  ", "                ")
          assert recovery.count(old) == 1, "Pocket 3 Wi-Fi retry warning block drifted"
          recovery = recovery.replace(old, new, 1)
          recovery_path.write_text(recovery, encoding="utf-8")

          test_path = Path("tests/test_pocket3_recovery.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''

          def test_saved_windows_profile_can_be_reused_without_ble(
          '''.replace("          ", "")
          addition = '''

          def test_native_config_rejects_non_positive_wifi_ap_settle_seconds() -> None:
              with pytest.raises(ValueError, match="wifi_ap_settle_seconds"):
                  Pocket3NativeConfig(wifi_ap_settle_seconds=0.0)


          def test_native_ble_session_settles_ap_before_releasing_windows_join() -> None:
              import inspect

              source = inspect.getsource(Pocket3NativeTrackerClient._ble_session)
              settle = source.index(
                  "await asyncio.sleep(self.config.wifi_ap_settle_seconds)"
              )
              credentials_ready = source.index("self._credentials_ready.set()")
              keepalive = source.index("keepalive = _build_duml")
              assert settle < credentials_ready < keepalive


          def test_saved_windows_profile_can_be_reused_without_ble(
          '''.replace("          ", "")
          assert tests.count(marker) == 1, "Pocket 3 recovery test insertion point drifted"
          tests = tests.replace(marker, addition, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Format touched files
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format src/jarvis/vision/pocket3_native.py src/jarvis/vision/pocket3_recovery.py tests/test_pocket3_recovery.py
          ruff check src/jarvis/vision/pocket3_native.py src/jarvis/vision/pocket3_recovery.py tests/test_pocket3_recovery.py

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/vision/pocket3_native.py src/jarvis/vision/pocket3_recovery.py tests/test_pocket3_recovery.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Stabilize Pocket 3 Wi-Fi AP wake sequencing"
          git push origin HEAD:fix/runtime-stability-pass
