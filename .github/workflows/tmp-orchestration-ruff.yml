name: Temporary Orchestration Ruff Format

on:
  push:
    branches:
      - feat/persistent-work-orchestration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[orchestration-ruff]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/persistent-work-orchestration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.16.5"

      - name: Format orchestration files
        run: |
          ruff format             src/jarvis/ai_provider.py             src/jarvis/config.py             src/jarvis/self_model/defaults.py             src/jarvis/voice/agent.py             src/jarvis/voice/canonical_active_speaker_runtime.py             src/jarvis/voice/production_runtime.py             src/jarvis/voice/work_tools.py             src/jarvis/work             tests/test_work_dbos.py             tests/test_work_development.py             tests/test_work_orchestration.py
          ruff check --fix             src/jarvis/ai_provider.py             src/jarvis/config.py             src/jarvis/self_model/defaults.py             src/jarvis/voice/agent.py             src/jarvis/voice/canonical_active_speaker_runtime.py             src/jarvis/voice/production_runtime.py             src/jarvis/voice/work_tools.py             src/jarvis/work             tests/test_work_dbos.py             tests/test_work_development.py             tests/test_work_orchestration.py

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/jarvis/ai_provider.py             src/jarvis/config.py             src/jarvis/self_model/defaults.py             src/jarvis/voice/agent.py             src/jarvis/voice/canonical_active_speaker_runtime.py             src/jarvis/voice/production_runtime.py             src/jarvis/voice/work_tools.py             src/jarvis/work             tests/test_work_dbos.py             tests/test_work_development.py             tests/test_work_orchestration.py
          git commit -m "Apply Ruff formatting to orchestration branch [orchestration-ruff]"
          git push origin HEAD:feat/persistent-work-orchestration
