name: Apply Phase45D Answerability V5 Patch Once

on:
  push:
    branches:
      - implementation/step-4-memory-context

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/research/_patch_phase45d_answerability_v5_once.py
      - run: python -m pip install ruff==0.16.5 pytest
      - run: ruff format tools/research/step4_phase45d_answerability_bakeoff.py tests/test_phase45d_answerability_bakeoff.py
      - run: ruff check tools/research/step4_phase45d_answerability_bakeoff.py tests/test_phase45d_answerability_bakeoff.py
      - run: pytest -q tests/test_phase45d_answerability_bakeoff.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/research/step4_phase45d_answerability_bakeoff.py tests/test_phase45d_answerability_bakeoff.py docs/research/STEP_4_PHASE_4_5D_ANSWERABILITY_BAKEOFF_METHOD.md docs/CURRENT_PLAN.md
          git commit -m 'Repair Phase 4.5D QA adapter for Transformers v5'
          git push origin HEAD:implementation/step-4-memory-context
