name: Win32 Window State Fix

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[win32-window-state-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply compatibility fix
        run: python tools/fix_win32_window_state.py
      - name: Format and lint touched files
        run: |
          python -m pip install ruff==0.16.5
          ruff format src/jarvis/capabilities/windows_native.py tests/test_windows_native_capabilities.py
          ruff check src/jarvis/capabilities/windows_native.py tests/test_windows_native_capabilities.py
      - name: Remove temporary fix files
        run: |
          rm -f tools/fix_win32_window_state.py
          rm -f .github/workflows/win32-window-state-fix.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix pywin32 window state detection [win32-window-state-fix]"
          git push origin HEAD:feat/governed-jarvis-hands-v1
