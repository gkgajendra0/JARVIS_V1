name: Native H1 Summary Fixup

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[native-h1-autofix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded summary patch
        run: python tools/native_h1_summary_fixup.py
      - name: Format and lint
        run: |
          python -m pip install ruff==0.16.5
          ruff format src/jarvis/capabilities/windows_native.py
          ruff check src/jarvis/capabilities/windows_native.py --fix
      - name: Remove temporary fixup files
        run: |
          rm -f tools/native_h1_summary_fixup.py
          rm -f .github/workflows/native-h1-summary-fixup.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden native H1 approval summaries [native-h1-autofix]"
          git push origin HEAD:feat/governed-jarvis-hands-v1
