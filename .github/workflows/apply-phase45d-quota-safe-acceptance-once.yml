name: Apply Phase 4.5D quota-safe acceptance once

on: [push]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run quota-safe acceptance patch once'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/research/_phase45d_apply_quota_safe_acceptance_once.py
      - run: |
          python -m pip install "ruff==0.16.5"
          ruff format tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py tools/research/_phase45d_apply_quota_safe_acceptance_once.py
          ruff check --fix tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py tools/research/_phase45d_apply_quota_safe_acceptance_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py docs/research/STEP_4_PHASE_4_5D_FINAL_COMPOSITE_ACCEPTANCE_METHOD.md
          git commit -m "Harden final composite acceptance for free-tier quota"
          git push origin HEAD:implementation/step-4-memory-context
