name: Hands live gate app-control repair

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch generic app lifecycle and voice routing
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          # Native app lifecycle: add a graceful WM_CLOSE path with verification.
          path = Path("src/jarvis/capabilities/windows_native.py")
          text = path.read_text(encoding="utf-8")
          text = once(
              text,
              "class WindowBackend(Protocol):\n"
              "    def list_windows(self) -> list[WindowSnapshot]: ...\n\n"
              "    def snapshot(self, app: str) -> WindowSnapshot: ...\n\n"
              "    def focus(self, app: str) -> WindowSnapshot: ...\n\n"
              "    def show(self, app: str, state: str) -> WindowSnapshot: ...\n\n"
              "    def move_next_monitor(self, app: str) -> dict[str, Any]: ...\n",
              "class WindowBackend(Protocol):\n"
              "    def list_windows(self) -> list[WindowSnapshot]: ...\n\n"
              "    def snapshot(self, app: str) -> WindowSnapshot: ...\n\n"
              "    def focus(self, app: str) -> WindowSnapshot: ...\n\n"
              "    def show(self, app: str, state: str) -> WindowSnapshot: ...\n\n"
              "    def close(self, app: str) -> dict[str, Any]: ...\n\n"
              "    def move_next_monitor(self, app: str) -> dict[str, Any]: ...\n",
              "window backend close protocol",
          )
          close_method = dedent('''
              def close(self, app: str) -> dict[str, Any]:
                  """Request normal window closure without terminating the process."""
                  _, _, win32con, win32gui, _ = self._modules()
                  needle = str(app).strip().casefold()
                  if not needle:
                      raise NativeWindowsError("window target app must not be empty")

                  def matches() -> list[WindowSnapshot]:
                      return [
                          item
                          for item in self.list_windows()
                          if needle in item.process.casefold() or needle in item.title.casefold()
                      ]

                  targets = matches()
                  if not targets:
                      raise NativeWindowsError(f"no visible window matched application: {app}")
                  for item in targets:
                      win32gui.PostMessage(item.hwnd, win32con.WM_CLOSE, 0, 0)

                  deadline = time.monotonic() + 5.0
                  remaining = matches()
                  while remaining and time.monotonic() < deadline:
                      time.sleep(0.05)
                      remaining = matches()
                  return {
                      "closed": not remaining,
                      "requested_windows": len(targets),
                      "remaining_windows": [item.payload() for item in remaining],
                      "forced_process_termination": False,
                  }

          ''')
          close_method = "\n".join(
              ("    " + line if line else "") for line in close_method.splitlines()
          ) + "\n"
          text = once(
              text,
              "    def move_next_monitor(self, app: str) -> dict[str, Any]:\n",
              close_method + "    def move_next_monitor(self, app: str) -> dict[str, Any]:\n",
              "pywin32 graceful close",
          )
          text = once(
              text,
              "class AppLifecycleBackend(Protocol):\n"
              "    def open(self, app: InstalledApp) -> dict[str, Any]: ...\n",
              "class AppLifecycleBackend(Protocol):\n"
              "    def open(self, app: InstalledApp) -> dict[str, Any]: ...\n\n"
              "    def close(self, app: InstalledApp) -> dict[str, Any]: ...\n",
              "app lifecycle protocol close",
          )
          text = once(
              text,
              "        ui_factory=WinAppCliBackend,\n"
              "    ) -> None:\n"
              "        self._catalog = catalog\n"
              "        self._ui_factory = ui_factory\n",
              "        ui_factory=WinAppCliBackend,\n"
              "        window_backend_factory=PyWin32WindowBackend,\n"
              "    ) -> None:\n"
              "        self._catalog = catalog\n"
              "        self._ui_factory = ui_factory\n"
              "        self._window_backend_factory = window_backend_factory\n",
              "catalog lifecycle window backend",
          )
          text = once(
              text,
              "        return {\n"
              "            \"app\": app.payload(),\n"
              "            \"launched\": launched,\n"
              "            \"running\": int(ready.payload.get(\"exit_code\", 1)) == 0,\n"
              "        }\n\n\n"
              "class AppLifecycleExecutor:\n",
              "        return {\n"
              "            \"app\": app.payload(),\n"
              "            \"launched\": launched,\n"
              "            \"running\": int(ready.payload.get(\"exit_code\", 1)) == 0,\n"
              "        }\n\n"
              "    def close(self, app: InstalledApp) -> dict[str, Any]:\n"
              "        data = self._window_backend_factory().close(app.display_name)\n"
              "        data[\"app\"] = app.payload()\n"
              "        return data\n\n\n"
              "class AppLifecycleExecutor:\n",
              "catalog graceful close",
          )
          text = once(
              text,
              "class AppLifecycleExecutor:\n"
              "    capability_key = \"app:lifecycle\"\n"
              "    operations = (\"open_app\",)\n",
              "class AppLifecycleExecutor:\n"
              "    capability_key = \"app:lifecycle\"\n"
              "    operations = (\"close_app\", \"open_app\")\n",
              "app lifecycle operations",
          )
          text = once(
              text,
              "                \"Resolve Start-menu applications dynamically through Windows AppsFolder, \"\n"
              "                \"launch the resolved Shell item, and verify the application is running.\"\n",
              "                \"Resolve Start-menu applications dynamically through Windows AppsFolder, \"\n"
              "                \"launch them, or request normal non-forced window closure, with verification.\"\n",
              "app lifecycle descriptor",
          )
          text = once(
              text,
              "    def prepare(self, request: CapabilityRequest) -> PreparedCapability:\n"
              "        if request.operation != \"open_app\":\n"
              "            raise ValueError(\"unsupported application lifecycle operation\")\n",
              "    def prepare(self, request: CapabilityRequest) -> PreparedCapability:\n"
              "        if request.operation not in self.operations:\n"
              "            raise ValueError(\"unsupported application lifecycle operation\")\n",
              "app lifecycle prepare operation",
          )
          text = once(
              text,
              "            material_summary=f\"Open Windows application: {app.display_name}\",\n",
              "            material_summary=(\n"
              "                f\"Open Windows application: {app.display_name}\"\n"
              "                if request.operation == \"open_app\"\n"
              "                else f\"Close Windows application gracefully: {app.display_name}\"\n"
              "            ),\n",
              "app lifecycle material summary",
          )
          text = once(
              text,
              "            backend = self._backend or CatalogAppLifecycleBackend(self._catalog)\n"
              "            data = backend.open(app)\n"
              "            verified = bool(data.get(\"running\"))\n"
              "            data[\"verification_passed\"] = verified\n",
              "            backend = self._backend or CatalogAppLifecycleBackend(self._catalog)\n"
              "            if prepared.request.operation == \"open_app\":\n"
              "                data = backend.open(app)\n"
              "                verified = bool(data.get(\"running\"))\n"
              "            else:\n"
              "                data = backend.close(app)\n"
              "                verified = bool(data.get(\"closed\"))\n"
              "            data[\"verification_passed\"] = verified\n",
              "app lifecycle execute close",
          )
          text = once(
              text,
              "            reason=None if verified else \"application launch verification failed\",\n"
              "            provenance=(\"Windows Shell AppsFolder\", \"Microsoft winapp\"),\n",
              "            reason=(\n"
              "                None\n"
              "                if verified\n"
              "                else \"application lifecycle verification failed\"\n"
              "            ),\n"
              "            provenance=(\n"
              "                \"Windows Shell AppsFolder\",\n"
              "                \"Microsoft winapp\",\n"
              "                \"Win32 WM_CLOSE (non-forced)\",\n"
              "            ),\n",
              "app lifecycle final result",
          )
          path.write_text(text, encoding="utf-8")

          # Semantic registry: expose graceful close as a general app-lifecycle primitive.
          path = Path("src/jarvis/hands/registry.py")
          text = path.read_text(encoding="utf-8")
          text = once(
              text,
              "            HandsOperation(\n"
              "                \"open_app\",\n"
              "                HandsDomain.APP_LIFECYCLE,\n"
              "                \"Launch one explicitly approved local application and verify it runs.\",\n"
              "                native_then_human,\n"
              "            ),\n",
              "            HandsOperation(\n"
              "                \"open_app\",\n"
              "                HandsDomain.APP_LIFECYCLE,\n"
              "                \"Launch one explicitly approved local application and verify it runs.\",\n"
              "                native_then_human,\n"
              "            ),\n"
              "            HandsOperation(\n"
              "                \"close_app\",\n"
              "                HandsDomain.APP_LIFECYCLE,\n"
              "                \"Request normal non-forced closure of an explicitly named local application.\",\n"
              "                native_then_human,\n"
              "            ),\n",
              "registry close app",
          )
          path.write_text(text, encoding="utf-8")

          # Voice goal boundary: generic imperative coverage + correct local-app routing guidance.
          path = Path("src/jarvis/voice/hands_goal_tools.py")
          text = path.read_text(encoding="utf-8")
          text = once(
              text,
              '    "open_app": ("open", "launch", "start"),\n',
              '    "open_app": ("open", "launch", "start"),\n'
              '    "close_app": ("close", "quit", "exit", "band"),\n',
              "close app intent",
          )
          text = once(
              text,
              "_APP_OPERATIONS = {\n"
              "    \"open_app\",\n",
              "_APP_OPERATIONS = {\n"
              "    \"open_app\",\n"
              "    \"close_app\",\n",
              "app operations close",
          )
          text = once(
              text,
              "_WINDOW_OPERATIONS = {\n"
              "    \"focus_window\",\n",
              "_WINDOW_OPERATIONS = {\n"
              "    \"close_app\",\n"
              "    \"focus_window\",\n",
              "window-context operations close",
          )
          text = once(
              text,
              "    \"open_app\",\n"
              "    \"execute_windows_plan\",\n",
              "    \"open_app\",\n"
              "    \"close_app\",\n"
              "    \"execute_windows_plan\",\n",
              "mutating close app",
          )
          text = once(
              text,
              '    "decrease",\n'
              '    "raise",\n',
              '    "decrease",\n'
              '    "reduce",\n'
              '    "raise",\n',
              "reduce imperative",
          )
          text = once(
              text,
              '    "move",\n'
              '    "open",\n',
              '    "move",\n'
              '    "close",\n'
              '    "quit",\n'
              '    "exit",\n'
              '    "open",\n',
              "close imperatives",
          )
          text = once(
              text,
              "        operation names, not friendly synonyms. In particular: `open_app`,\n",
              "        operation names, not friendly synonyms. In particular: `open_app`, `close_app`,\n",
              "tool close app guidance",
          )
          routing_old = (
              "        Prefer native semantic operations over UI. Use app UI only for interaction that\n"
              "        has no better native capability. Visual computer use is owner-enabled fallback.\n"
          )
          routing_new = (
              "        Prefer native semantic operations over UI. Generic play/pause/next/previous/stop\n"
              "        for the already-active Windows media session should use the media operations.\n"
              "        Selecting named content inside a local desktop app (for example a playlist,\n"
              "        song, search result, menu, or control in Apple Music/Spotify) belongs to\n"
              "        `execute_windows_plan`, not `execute_browser_plan`. If that local app is not\n"
              "        open yet, emit `open_app` first and then `execute_windows_plan`. Use\n"
              "        `execute_browser_plan` only when the latest USER request actually grounds a\n"
              "        browser/website/web-page/URL goal. Visual computer use is owner-enabled fallback.\n"
          )
          text = once(text, routing_old, routing_new, "local app routing guidance")
          path.write_text(text, encoding="utf-8")

          # Native capability tests.
          path = Path("tests/test_windows_native_capabilities.py")
          text = path.read_text(encoding="utf-8")
          text = once(
              text,
              "class FakeAppLifecycle:\n"
              "    def open(self, app: str):\n"
              "        return {\"app\": app, \"launched\": True, \"running\": True}\n",
              "class FakeAppLifecycle:\n"
              "    def open(self, app: str):\n"
              "        return {\"app\": app, \"launched\": True, \"running\": True}\n\n"
              "    def close(self, app: str):\n"
              "        return {\"app\": app, \"closed\": True, \"forced_process_termination\": False}\n",
              "fake lifecycle close",
          )
          addition = dedent('''

          def test_app_lifecycle_close_is_graceful_and_verified() -> None:
              executor = AppLifecycleExecutor(FakeAppLifecycle())
              prepared = executor.prepare(
                  request(executor, "close_app", {"app": "calculator"})
              )

              result = executor.execute(prepared)

              assert prepared.attributes.reversible_local_change is True
              assert prepared.material_summary == "Close Windows application gracefully: calculator"
              assert result.status is CapabilityStatus.SUCCEEDED
              assert result.data["closed"] is True
              assert result.data["forced_process_termination"] is False
              assert result.data["verification_passed"] is True
          ''')
          if "test_app_lifecycle_close_is_graceful_and_verified" in text:
              raise SystemExit("native close regression already present")
          text = text.rstrip() + addition + "\n"
          path.write_text(text, encoding="utf-8")

          # Voice regressions reproduced from the owner live transcript.
          path = Path("tests/test_hands_goal_tools.py")
          text = path.read_text(encoding="utf-8")
          addition = dedent('''

          def test_voice_reduce_is_an_explicit_volume_action() -> None:
              grounded = parse(
                  tools("Jarvis reduce the master volume to 25% again."),
                  "set_master_volume",
                  {"percent": 25},
              )
              assert grounded == {"percent": 25.0}


          def test_voice_close_app_is_a_grounded_lifecycle_action() -> None:
              tool = tools("Jarvis close calculator")
              plan = json.dumps(
                  [{"operation": "close_app", "parameters": {"app": "calculator"}}]
              )
              step = tool._parse_plan(plan, tool._latest_user_turn().text)[0]
              assert step.operation == "close_app"
              assert step.parameters == {"app": "calculator"}


          def test_named_playlist_in_local_app_uses_structured_windows_plan() -> None:
              tool = tools("Okay. Jarvis, play Bhakti playlist on Apple Music app.")
              plan = json.dumps(
                  [
                      {
                          "operation": "execute_windows_plan",
                          "parameters": {
                              "app": "Apple Music",
                              "plan": [
                                  {"action": "search", "query": "Bhakti"},
                                  {"action": "click", "selector": "Bhakti"},
                                  {"action": "click", "selector": "Play"},
                              ],
                          },
                      }
                  ]
              )
              step = tool._parse_plan(plan, tool._latest_user_turn().text)[0]
              assert step.operation == "execute_windows_plan"
              assert step.parameters["app"] == "Apple Music"
              assert step.parameters["task"] == tool._latest_user_turn().text
              assert step.parameters["allow_existing_app"] is True
              assert step.parameters["plan"][0] == {"action": "search", "query": "Bhakti"}
          ''')
          if "test_voice_reduce_is_an_explicit_volume_action" in text:
              raise SystemExit("live transcript regressions already present")
          text = text.rstrip() + addition + "\n"
          path.write_text(text, encoding="utf-8")

      - name: Install targeted dependencies
        run: python -m pip install -e ".[dev,hands]"
      - name: Format and lint
        run: |
          python -m ruff format src/jarvis/capabilities/windows_native.py src/jarvis/hands/registry.py src/jarvis/voice/hands_goal_tools.py tests/test_windows_native_capabilities.py tests/test_hands_goal_tools.py
          python -m ruff check src/jarvis/capabilities/windows_native.py src/jarvis/hands/registry.py src/jarvis/voice/hands_goal_tools.py tests/test_windows_native_capabilities.py tests/test_hands_goal_tools.py
      - name: Focused regressions
        run: python -m pytest -q tests/test_windows_native_capabilities.py tests/test_hands_registry.py tests/test_hands_goal_tools.py tests/test_production_hands_voice_wiring.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/capabilities/windows_native.py src/jarvis/hands/registry.py src/jarvis/voice/hands_goal_tools.py tests/test_windows_native_capabilities.py tests/test_hands_goal_tools.py
          git diff --cached --quiet && exit 0
          git commit -m "Complete generic app lifecycle voice control"
          git push origin HEAD:feat/governed-jarvis-hands-v1
