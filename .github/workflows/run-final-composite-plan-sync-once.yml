name: Run final composite plan sync once

on: [push]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Run scoped final composite plan sync once'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/research/_phase45d_sync_final_composite_plan_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_PLAN.md
          git commit -m "Synchronize final composite acceptance plan"
          git push origin HEAD:implementation/step-4-memory-context
