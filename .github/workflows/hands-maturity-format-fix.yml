name: Hands maturity format fix

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff and test dependencies
        run: python -m pip install -e ".[dev,hands]"
      - name: Remove redundant migration wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/jarvis/hands/orchestrator.py")
          text = path.read_text(encoding="utf-8")
          old = '''        try:\n            selected = await self._planner.route(\n                goal=latest,\n                recent_user_turns=recent_user_turns,\n                route_groups=route_groups,\n            )\n        except HandsPlanningError:\n            raise\n'''
          new = '''        selected = await self._planner.route(\n            goal=latest,\n            recent_user_turns=recent_user_turns,\n            route_groups=route_groups,\n        )\n'''
          if old not in text:
              raise SystemExit("redundant route wrapper anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Format and lint maturity files
        run: |
          python -m ruff format src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
          python -m ruff check --fix src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
          python -m ruff format src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
          python -m ruff check src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
      - name: Run Hands maturity architecture tests
        run: python -m pytest -q tests/test_hands_contracts.py tests/test_hands_entities.py tests/test_hands_orchestrator.py tests/test_hands_goal_tools.py tests/test_hands_authority.py tests/test_hands_registry.py tests/test_production_hands_voice_wiring.py
      - name: Commit formatted maturity implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
          git diff --cached --quiet && exit 0
          git commit -m "Format and validate mature Hands orchestrator"
          git push origin HEAD:feat/governed-jarvis-hands-v1
