name: Hands maturity format fix

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff and test dependencies
        run: python -m pip install -e ".[dev,hands]"
      - name: Apply final orchestrator invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/jarvis/hands/orchestrator.py")
          text = path.read_text(encoding="utf-8")
          old_route = '''        try:\n            selected = await self._planner.route(\n                goal=latest,\n                recent_user_turns=recent_user_turns,\n                route_groups=route_groups,\n            )\n        except HandsPlanningError:\n            raise\n'''
          new_route = '''        selected = await self._planner.route(\n            goal=latest,\n            recent_user_turns=recent_user_turns,\n            route_groups=route_groups,\n        )\n'''
          if old_route in text:
              text = text.replace(old_route, new_route, 1)
          old_complete = '''            if decision.goal_complete:\n                if not results:\n                    raise HandsOrchestrationError(\n                        "planner claimed goal completion without any verified execution"\n                    )\n                return {\n'''
          new_complete = '''            if decision.goal_complete:\n                if not results:\n                    raise HandsOrchestrationError(\n                        "planner claimed goal completion without any verified execution"\n                    )\n                latest_result = results[-1]\n                latest_observation = observations[-1]\n                if not latest_result.ok or not bool(latest_observation.get("verified")):\n                    raise HandsOrchestrationError(\n                        "planner claimed goal completion without a successful latest execution"\n                    )\n                return {\n'''
          if old_complete not in text:
              raise SystemExit("goal completion anchor not found")
          path.write_text(text.replace(old_complete, new_complete, 1), encoding="utf-8")
          PY
      - name: Format and lint maturity files
        run: |
          python -m ruff format src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
          python -m ruff check --fix src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
          python -m ruff format src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
          python -m ruff check src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
      - name: Run Hands maturity architecture tests
        run: python -m pytest -q tests/test_hands_contracts.py tests/test_hands_entities.py tests/test_hands_orchestrator.py tests/test_hands_goal_tools.py tests/test_hands_authority.py tests/test_hands_registry.py tests/test_production_hands_voice_wiring.py
      - name: Commit validated maturity implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis/hands/entities.py src/jarvis/hands/orchestrator.py tests/test_hands_contracts.py tests/test_hands_orchestrator.py
          git diff --cached --quiet && exit 0
          git commit -m "Validate mature Hands orchestrator invariants"
          git push origin HEAD:feat/governed-jarvis-hands-v1
