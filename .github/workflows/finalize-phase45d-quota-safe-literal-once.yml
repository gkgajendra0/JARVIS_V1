name: Apply literal Phase 4.5D quota-safe provider boundary once

on: [push]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Apply literal quota-safe provider boundary once'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply exact checked-in blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          h = Path('tools/research/step4_phase45d_final_composite_acceptance.py')
          text = h.read_text(encoding='utf-8')

          old = '''class ProviderCallBudgetExceeded(RuntimeError):
              """Raised before a provider call would exceed the certified invocation budget."""


          class PacedMemoryQueryInterpreter:
          '''
          old = old.replace('          class', 'class').replace('              """', '    """')
          new = '''class ProviderCallBudgetExceeded(RuntimeError):
              """Raised before a provider call would exceed the certified invocation budget."""


          class ProviderExecutionPaused(RuntimeError):
              """Raised only when the provider adapter fails after a certified API attempt."""


          class PacedMemoryQueryInterpreter:
          '''
          new = new.replace('          class', 'class').replace('              """', '    """')
          if text.count(old) != 1:
              raise SystemExit(f'class marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        self.logical_calls += 1
              self.api_attempts += 1
              proposal = await self._delegate.interpret(text=text, catalog=catalog)
              self.last_proposal = proposal
              self.last_attempts = 1
              return proposal
          '''
          old = old.replace('\n              ', '\n        ')
          new = '''        self.logical_calls += 1
              self.api_attempts += 1
              self.last_attempts = 1
              try:
                  proposal = await self._delegate.interpret(text=text, catalog=catalog)
              except Exception as exc:
                  raise ProviderExecutionPaused(
                      f"provider adapter failed: {type(exc).__name__}"
                  ) from exc
              self.last_proposal = proposal
              return proposal
          '''
          new = new.replace('\n              ', '\n        ').replace('\n                  ', '\n            ').replace('\n                      ', '\n                ')
          if text.count(old) != 1:
              raise SystemExit(f'provider-call marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '    except Exception as exc:\n        print("STATUS: EXECUTION_PAUSED_PROVIDER")\n'
          new = '    except ProviderExecutionPaused as exc:\n        print("STATUS: EXECUTION_PAUSED_PROVIDER")\n'
          if text.count(old) != 1:
              raise SystemExit(f'main catch marker count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '                    "error_type": type(exc).__name__,\n'
          new = '''                    "error_type": (
                        type(exc.__cause__).__name__
                        if exc.__cause__ is not None
                        else type(exc).__name__
                    ),
          '''
          if text.count(old) != 1:
              raise SystemExit(f'error-type marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          h.write_text(text, encoding='utf-8')

          t = Path('tests/test_phase45d_final_composite_acceptance.py')
          tests = t.read_text(encoding='utf-8')
          old = '''    try:
              asyncio.run(interpreter.interpret(text="test", catalog=catalog))
          except RuntimeError as exc:
              assert "429" in str(exc)
          else:
              raise AssertionError("delegate failure should propagate")

              assert delegate.calls == 1
              assert interpreter.logical_calls == 1
              assert interpreter.api_attempts == 1
          '''
          old = old.replace('\n              ', '\n    ')
          new = '''    try:
              asyncio.run(interpreter.interpret(text="test", catalog=catalog))
          except harness.ProviderExecutionPaused as exc:
              assert isinstance(exc.__cause__, RuntimeError)
              assert "429" in str(exc.__cause__)
          else:
              raise AssertionError("provider failure should become a resumable provider pause")

              assert delegate.calls == 1
              assert interpreter.logical_calls == 1
              assert interpreter.api_attempts == 1
              assert interpreter.last_attempts == 1
          '''
          new = new.replace('\n              ', '\n    ')
          if tests.count(old) != 1:
              raise SystemExit(f'test marker count={tests.count(old)}')
          tests = tests.replace(old, new, 1)
          t.write_text(tests, encoding='utf-8')
          PY
      - name: Format and lint
        shell: bash
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
          ruff check --fix tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/step4_phase45d_final_composite_acceptance.py tests/test_phase45d_final_composite_acceptance.py
          git commit -m "Finalize quota-safe provider pause boundary"
          git push origin HEAD:implementation/step-4-memory-context
