name: Format Phase 4.5D Single Instance Once

on:
  push:
    branches:
      - implementation/step-4-memory-context
    paths:
      - .github/workflows/format-phase45d-single-instance-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: implementation/step-4-memory-context
          fetch-depth: 0

      - name: Format and lint scoped files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/research/step4_phase45d_gemini_single_instance_boundary_diagnostic.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'raise RuntimeError("semantic-judge source artifact must be a JSON object")',
              'raise TypeError("semantic-judge source artifact must be a JSON object")',
          )
          text = text.replace(
              'raise RuntimeError("semantic-judge source artifact has no model metadata")',
              'raise TypeError("semantic-judge source artifact has no model metadata")',
          )
          text = text.replace(
              'raise RuntimeError("source artifact cases are missing")',
              'raise TypeError("source artifact cases are missing")',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install "ruff==0.16.5"
          ruff format tools/research/step4_phase45d_gemini_single_instance_boundary_diagnostic.py tests/test_phase45d_gemini_single_instance_boundary_diagnostic.py
          ruff check --fix tools/research/step4_phase45d_gemini_single_instance_boundary_diagnostic.py tests/test_phase45d_gemini_single_instance_boundary_diagnostic.py
          ruff format tools/research/step4_phase45d_gemini_single_instance_boundary_diagnostic.py tests/test_phase45d_gemini_single_instance_boundary_diagnostic.py
          ruff check tools/research/step4_phase45d_gemini_single_instance_boundary_diagnostic.py tests/test_phase45d_gemini_single_instance_boundary_diagnostic.py

      - name: Commit scoped formatter result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/step4_phase45d_gemini_single_instance_boundary_diagnostic.py tests/test_phase45d_gemini_single_instance_boundary_diagnostic.py
          git commit -m "Format Phase 4.5D single-instance diagnostic"
          git push origin HEAD:implementation/step-4-memory-context
