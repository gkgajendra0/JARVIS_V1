name: Native H1 Format

on:
  push:
    branches:
      - feat/governed-jarvis-hands-v1

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[native-h1-format]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-jarvis-hands-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format native H1 acceptance files
        run: |
          python -m pip install ruff==0.16.5
          ruff format src/jarvis/computer/hands_smoke.py tests/test_hands_smoke.py tests/test_windows_native_capabilities.py
          ruff check src/jarvis/computer/hands_smoke.py tests/test_hands_smoke.py tests/test_windows_native_capabilities.py --fix
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/native-h1-format.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format native H1 acceptance harness [native-h1-format]"
          git push origin HEAD:feat/governed-jarvis-hands-v1
