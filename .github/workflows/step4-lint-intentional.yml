name: Step 4 intentional research lint cleanup

on:
  push:
    branches:
      - research/step-4-memory-context
    paths:
      - ".github/workflows/step4-lint-intentional.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/step-4-memory-context
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Apply explicit research-harness lint annotations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          extraction = "tools/research/step4_memory_extraction_bakeoff.py"
          replace_exact(
              extraction,
              'raise ValueError("case corpus must be a JSON list")',
              'raise TypeError("case corpus must be a JSON list")',
          )
          replace_exact(
              extraction,
              'except Exception as exc:  # research harness records failures instead of hiding them',
              'except Exception as exc:  # noqa: BLE001 - provider SDK failures are benchmark evidence',
              2,
          )

          retrieval = "tools/research/step4_memory_retrieval_bakeoff.py"
          replace_exact(
              retrieval,
              'except (\n            Exception\n        ) as exc:  # report one model failure without hiding other evidence',
              'except Exception as exc:  # noqa: BLE001 - one model failure must not erase other benchmark evidence',
          )

          precision = "tools/research/step4_qwen_reranker_precision_bakeoff.py"
          replace_exact(
              precision,
              'except Exception as exc:\n            output["status"] = "PARTIAL"',
              'except Exception as exc:  # noqa: BLE001 - one precision failure is recorded as PARTIAL\n            output["status"] = "PARTIAL"',
          )

          sqlcipher = "tools/research/step4_sqlcipher_dpapi_bakeoff.py"
          replace_exact(
              sqlcipher,
              'except Exception:\n        return True',
              'except Exception:  # noqa: BLE001 - any keyed-open failure proves the wrong key was blocked\n        return True',
          )
          replace_exact(
              sqlcipher,
              'except Exception:\n        pass\n\n    integrity_before',
              'except Exception:  # noqa: BLE001 - cipher_status is optional across SQLCipher builds\n        cipher_status = None\n\n    integrity_before',
          )
          replace_exact(
              sqlcipher,
              'except Exception as exc:\n                    corruption_detected = True',
              'except Exception as exc:  # noqa: BLE001 - any DB failure is valid corruption detection evidence\n                    corruption_detected = True',
          )
          replace_exact(
              sqlcipher,
              'except Exception as exc:\n        corruption_detected = True',
              'except Exception as exc:  # noqa: BLE001 - open/integrity failure is valid corruption evidence\n        corruption_detected = True',
          )
          PY

          python -m pip install "ruff==0.16.5"
          ruff format tools/research/
          ruff check .
          git diff --check

      - name: Commit explicit lint cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research/
          git commit -m "Document intentional Step 4 research failure catches"
          git push origin HEAD:research/step-4-memory-context
