[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Clean application foundation for JARVIS V1."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["livekit-agents[openai]==1.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
