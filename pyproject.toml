[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Clean application foundation for JARVIS V1."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit==1.1.15",
    "livekit-agents[google,openai]==1.7.1",
    "livekit-wakeword==0.2.1",
    "sounddevice>=0.5,<1",
    "numpy>=2,<3",
    "opencv-python==5.0.0.93",
    "opencv-contrib-python==5.0.0.93",
    "cryptography==50.0.1",
    "number-parser==0.3.2",
]

[project.scripts]
jarvis-setup = "jarvis.setup:main"
jarvis-voice = "jarvis.voice.production_runtime:main"
jarvis-dev = "jarvis.dev_supervisor:main"
jarvis-vision-preview = "jarvis.vision.preview:main"
jarvis-vision-follow = "jarvis.vision.follow_live:main"
jarvis-face-model-smoke = "jarvis.identity.model_smoke:main"
jarvis-face-live-benchmark = "jarvis.identity.live_face_benchmark:main"
jarvis-face-calibrate = "jarvis.identity.calibration:main"
jarvis-face-calibrate-owner = "jarvis.identity.owner_calibration:main"
jarvis-face-liveness = "jarvis.identity.liveness_live:main"
jarvis-passive-pad-benchmark = "jarvis.identity.passive_pad_benchmark:main"
jarvis-owner-evidence-live = "jarvis.identity.owner_evidence_live:main"
jarvis-speaker-benchmark = "jarvis.identity.speaker_benchmark:main"
jarvis-speaker-enroll = "jarvis.identity.speaker_enrollment:main"
jarvis-active-speaker-benchmark = "jarvis.identity.active_speaker_benchmark_guided:main"

[project.optional-dependencies]
vision = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "rfdetr==1.9.4",
    "trackers==2.6.0",
    "mediapipe==1.0.1",
    "onnxruntime==1.29.0",
    "duvc-ctl==2.1.0; platform_system == 'Windows'",
]
speaker = ["sherpa-onnx==1.13.6"]
active-speaker = [
    "python_speech_features==0.6",
    "scipy>=1.14,<2",
]
active-speaker-benchmark = [
    "python_speech_features==0.6",
    "scipy>=1.14,<2",
    "scikit-learn==1.9.0",
    "psutil==7.2.2",
]
sensor-av = [
    "gstreamer-bundle==1.28.6; platform_system == 'Windows'",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff==0.16.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.identity" = ["manifests/*.json"]
"jarvis.memory" = ["migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["jarvis"]

[tool.ruff.lint.per-file-ignores]
"tests/test_authority_foundation.py" = ["B017"]
"tests/test_opa_policy_adapter.py" = ["PYI034"]
