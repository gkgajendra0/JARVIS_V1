model_name: jarvis
target_phrases: ["jarvis"]
tts_backend: piper_vits
n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 16
max_speakers: 800
custom_negative_phrases:
  - "service"
  - "harvest"
  - "nervous"
  - "garbage"
  - "drivers"
  - "just this"
  - "justice"
  - "charge it"
  - "charles"
noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]
data_dir: /training/data
output_dir: /training/results
augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 2
  background_paths: [/training/data/backgrounds]
  rir_paths: [/training/data/rirs]
model:
  model_type: conv_attention
  model_size: small
steps: 50000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 1500
target_fp_per_hour: 0.2
batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 512
  background_noise: 50
